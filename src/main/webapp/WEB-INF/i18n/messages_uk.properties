tfa.title=Двофакторна перевірка
tfa.lead=Крім пароля, під час входу ти введеш ще й код із застосунку в телефоні (Google Authenticator, Microsoft Authenticator, Aegis…). Хто знає лише твій пароль, до облікового запису не потрапить.
