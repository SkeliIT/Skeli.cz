privacy.updated=Діє з 5 листопада 2026 року
privacy.lead=Тут дізнаєшся, які особисті дані обробляє skeli.cz, навіщо, як довго їх зберігає та які маєш права.
privacy.s1.t=Хто відповідає
privacy.s1.p=Контролером особистих даних є Радек Дворжак (Skeli). З питань конфіденційності пиши мені на <a href="mailto:skelimc@seznam.cz">skelimc@seznam.cz</a>. На ту саму адресу можна надіслати й запит на доступ до даних, їх виправлення чи видалення.
privacy.s2.t=Що ми обробляємо і навіщо
privacy.s2.account=<b>Обліковий запис:</b> ім’я користувача, e-mail, пароль (лише як хеш bcrypt, сам пароль ми не знаємо), дата реєстрації та підтвердження e-mail. Потрібні для роботи облікового запису й функцій для зареєстрованих, наприклад коментарів і голосування (виконання договору, тобто умов користування).
privacy.s2.profile=<b>Профіль (необов’язково):</b> відображуване ім’я, вік, місто, кілька слів про себе, фото профілю, обкладинка профілю, вигляд і мова сайту. Заповнюєш лише те, що хочеш, і будь-коли можеш змінити чи видалити (згода). Запити в друзі та заблокованих людей бачиш лише ти. Чи побачать інші зареєстровані твоє місто, кілька слів про тебе, пісні із сердечком, друзів, статус онлайн або останню активність, вирішуєш у Налаштуваннях → Приватність. Якщо додаси свою творчість, ми збережемо назву, рік і посилання на треки; інші зареєстровані бачитимуть їх, доки ти це не вимкнеш. Якщо відкриєш профіль і для незареєстрованих, твоє ім’я, фото, представлення й треки побачить будь-хто з посиланням. Пошуковим системам такий профіль не пропонуємо (просимо їх не індексувати його), але не можемо гарантувати, що посилання ніде не з’явиться.
privacy.s2.comments=<b>Коментарі та голоси:</b> текст коментаря, дата й голоси за пісні та коментарі. Коментарі публічні, разом з ім’ям автора. Скарги на коментарі бачить лише адміністратор.
privacy.s2.newsletter=<b>Новини e-mailом:</b> твій e-mail і дати підписки та підтвердження. Підписка почнеться лише після кліку на посилання в листі-підтвердженні, у кожному листі є посилання для відписки (згода).
privacy.s2.security=<b>Безпека:</b> IP-адресу ненадовго тримаємо в пам’яті сервера для захисту від спаму й підбору паролів; якщо з неї приблизно добу не буде нової спроби, вона забудеться. Вона також з’являється в технічних журналах сервера. Коли встановлюєш пароль, перевіряємо в сервісі Have I Been Pwned, чи не витік він з інших сайтів: надсилаються лише перші 5 символів його хешу SHA-1, ніколи не пароль і не твої дані (законний інтерес — безпека).
privacy.s2.stats=<b>Підрахунок відвідувань (без cookies):</b> коли сторінка відображається, сайт обчислює з IP-адреси та типу браузера (у зареєстрованих — з номера облікового запису) щоденний відбиток за допомогою випадкового ключа дня. Ключ щодня опівночі замінюється новим, тож відбитки з різних днів не можна пов’язати між собою. Протягом дня, поки ключ ще діє, відбиток зареєстрованого користувача можна було б пов’язати з його обліковим записом, тому ми не вважаємо його анонімним. Зберігаються лише день і відбиток, IP-адресу й тип браузера не зберігаємо. Слугує лише для чисел: скільки людей зараз на сайті, скільки прийшло за день і скільки разів прочитали текст пісні. Відбитки завершених днів видаляємо наступного дня, лишається лише кількість людей за день (законний інтерес — огляд відвідуваності).
privacy.s2.plays=<b>Що слухають найбільше (без cookies):</b> тим самим щоденним відбитком рахується, скільки разів відкрили текст пісні, запустили відео й увійшли в караоке-кінотеатр. Кожна річ рахується тобі щонайбільше раз на день, навіть якщо під час відвідування ти увійдеш в обліковий запис. Відбитки біля окремих пісень і відео видаляємо наступного дня, лишаються тільки суми. Слугує для оглядів в адмініструванні (законний інтерес — огляд того, що подобається людям).
privacy.s2.reports=<b>Повідомлення Кевіну про проблему (необов'язково):</b> текст, який ти напишеш, і адреса сторінки, на якій ти був; для тих, хто ввійшов, – також твій обліковий запис. IP-адресу ми не зберігаємо. Бачить це лише адміністратор і видаляє повідомлення, щойно проблему виправлено (законний інтерес – виправлення помилок сайту).
privacy.s2.help=<b>Доповнення відсутнього тексту пісні (необов'язково):</b> текст, який ти напишеш; для тих, хто ввійшов, – також твій обліковий запис. IP-адресу ми не зберігаємо. Бачить це лише адміністратор і видаляє після опрацювання (законний інтерес – повні тексти пісень).
privacy.s2.marketing=<b>Звідки приходять відвідувачі (статистика):</b> на початку візиту ми рахуємо лише назву сайту, з якого ти прийшов (напр. instagram.com – більше нічого з адреси), позначку кампанії з посилання (напр. ?z=ig-bio), тип пристрою (телефон / планшет / комп'ютер), мову сайту та годину. Так само ми лише рахуємо кліки на посилання на Spotify, Apple Music, YouTube і соцмережі та слова, які шукають у Текстах (видаляємо через 90 днів). Зберігаються лише денні підсумки – без cookies, без IP-адреси, нічого з цього не можна пов'язати з тобою (законний інтерес – знати, звідки приходять фанати і що їх цікавить).
privacy.s2.trash=<b>Кошик в адміністрації:</b> коли адміністратор видаляє коментар (або пісню чи відео разом із коментарями під ними), його копія 30 днів лишається в кошику, щоб помилку можна було виправити; потім вона видаляється назавжди. Коментар, який видалиш ти сам, не зберігається (законний інтерес – захист від помилок).
privacy.s2.social=<b>Друзі та сповіщення:</b> запити в друзі, список друзів і заблокованих людей та сповіщення у дзвіночку (відповіді, сердечка, запити, повідомлення, CatSmash). Заблокований нічого про це не дізнається, і від нього тобі не прийде жодне сповіщення. Скарги на профіль чи коментар (хто, на кого, причина й примітка) бачить лише адміністратор.
privacy.s2.games=<b>CatSmash і значки:</b> результати матчів проти Кевіна (час, рахунок, складність), рекорди, отримані значки, вибрана рамка чи знак біля імені та значки сайту (за коментарі, друзів, караоке тощо). Результати є в таблицях рекордів, які бачить кожен. Твоє ім’я та фото інші побачать там лише тоді, коли ти в Налаштуваннях → Приватність увімкнеш «Моє ім’я в таблицях CatSmash». Інакше ти там анонімний гравець, а твій профіль не показує іншим час і місця в таблицях.
privacy.s2.rewards=<b>Вигляд і нагороди:</b> у які дні ти був увійшовши на сайт (лише дата, без часу й без того, що ти робив), які нагороди ти відкрив і який вигляд вибрав (вигляд профілю, шрифт і стиль караоке). Кількість днів потрібна лише для відкриття нагород. Видаляється разом з обліковим записом і є в експорті даних.
privacy.s2.tfa=<b>Двофакторна автентифікація (необов’язково):</b> ключ для застосунку в телефоні зберігаємо зашифрованим, а резервні коди — лише як хеші. Вони потрібні тільки для входу.
privacy.s3.t=Cookies і сховище браузера
privacy.s3.session=<b>Необхідний cookie входу</b> (JSESSIONID): без нього вхід не працює. Діє до закриття браузера, з «Запам'ятати на цьому пристрої» – 30 днів.
privacy.s3.known=<b>Відомий пристрій</b> (skeliKnown): після успішного входу браузер на рік запам’ятовує номер твого облікового запису з підписом. Якщо хтось чужий намагається вгадати твій пароль і через це вхід до облікового запису тимчасово блокується, зі свого пристрою ти увійдеш далі. Cookie сама нічого не відкриває, пароль потрібен завжди (законний інтерес — безпека).
privacy.s3.storage=<b>Налаштування в браузері</b> (localStorage і sessionStorage): твій вибір у панелі cookies, світлий чи темний режим, шрифт і розмір тексту, налаштування караоке, ефектів і звуків, налаштування Кевіна та гри CatSmash (локальні рекорди й відкриті речі). Вони лишаються у твоєму браузері й самі на сервер не надсилаються. Винятком є значки з матчу CatSmash, які гра зберігає у твоєму обліковому записі.
privacy.s4.t=Вміст інших сервісів
privacy.s4.p=Відео YouTube і плеєр Spotify завантажуються лише після твоєї згоди в смузі cookie або кліку на «Завантажити плеєр». Тоді YouTube (Google) чи Spotify бачать твою IP-адресу й діють за своїми правилами. Мініатюри відео, шрифти та іконки надходять з нашого сервера. Посилання на Instagram, Facebook, YouTube, Spotify і Apple Music ведуть на їхні сайти.
privacy.s5.t=Кому передаємо дані
privacy.s5.p=Ми їх ніколи не продаємо. Технічно їх обробляє оператор сервера й пошти, на якому працює сайт (хостинг у Чехії); листи (підтвердження облікового запису, відновлення пароля, новини) надсилаються через поштовий сервер.
privacy.s6.t=Як довго
privacy.s6.p=Обліковий запис і профіль — до видалення облікового запису. Розсилка новин — до відписки. Посилання для відновлення пароля діє 30 хвилин, підтвердження e-mail — 48 годин. Повідомлення, скарги й статистика мають власні строки, описані вище. Резервні копії бази даних слугують лише для відновлення після збою.
privacy.s6.more=Повідомлення про проблеми – до їх вирішення. Твоя оцінка сайту – до видалення облікового запису.
privacy.s7.t=Видалення облікового запису
privacy.s7.p=У Налаштуваннях → Видалити обліковий запис. Видаляються ім’я, e-mail, пароль, вхід через Google, двофакторна автентифікація, фото профілю, обкладинка профілю, профіль, творчість, друзі й заблоковані, сповіщення, повідомлення, результати ігор і значки, оцінка сайту та підписка на новини, і ти вийдеш з усіх пристроїв. Коментарі лишаться з позначкою «Видалений обліковий запис», а голоси лишаться врахованими, уже без зв’язку з тобою. Скарги, які ти надіслав, видаляються, щойно адміністратор їх розгляне. Скарги на твій обліковий запис чи твої повідомлення лишаються як доказ до розгляду, а потім щонайбільше рік (законний інтерес — захист інших користувачів). Хочеш видалити й коментарі? Напиши на <a href="mailto:skelimc@seznam.cz">skelimc@seznam.cz</a>.
privacy.s8.t=Твої права
privacy.s8.p=Ти маєш право на доступ до своїх даних і їх виправлення, а за умов, передбачених законом, також на видалення, обмеження обробки й перенесення. Можеш заперечити проти обробки й відкликати згоду, що не вплине на обробку до відкликання. Свої дані завантажиш у Налаштуваннях → Експорт даних (JSON), профіль виправиш прямо в Налаштуваннях. Із запитами звертайся на <a href="mailto:skelimc@seznam.cz">skelimc@seznam.cz</a>. Скаргу можна подати до чеського Управління із захисту персональних даних (<a href="https://uoou.gov.cz" target="_blank" rel="noopener">uoou.gov.cz</a>).
privacy.s9.t=Вік
privacy.s9.p=Якщо тобі ще немає 15 років, для реєстрації потрібна згода батьків або законного представника.
