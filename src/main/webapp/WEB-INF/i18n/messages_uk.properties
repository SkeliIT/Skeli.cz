consent.spotify=Плеєр Spotify завантажується з серверів Spotify, які при цьому бачать твою IP-адресу. Він завантажиться після кліку або твоєї згоди в смузі cookie.
privacy.updated=Діє з 8 жовтня 2026 року
privacy.lead=Зрозуміло й чесно: які дані обробляє skeli.cz, навіщо, як довго і що ти можеш з ними зробити.
privacy.s1.t=Хто відповідає
privacy.s1.p=Контролер персональних даних – Радек Дворжак (Skeli), e-mail <a href="mailto:skelimc@seznam.cz">skelimc@seznam.cz</a>. Усі запити щодо своїх даних надсилай на цю адресу.
privacy.s2.t=Що ми обробляємо і навіщо
privacy.s2.account=<b>Обліковий запис:</b> ім'я користувача, e-mail, пароль (лише як зашифрований хеш bcrypt – самого пароля ми не знаємо), дата реєстрації та підтвердження e-mail. Для роботи облікового запису, коментарів і голосування (виконання договору – умови користування).
privacy.s2.profile=<b>Профіль (необов'язковий):</b> відображуване ім'я, вік, місто, кілька слів про себе, фото профілю, тема і мова. Заповнюєш лише те, що хочеш, і будь-коли змінюєш чи видаляєш (згода).
privacy.s2.comments=<b>Коментарі та голоси:</b> текст коментаря, дата і голоси за пісні та коментарі. Коментарі публічні. Скарги на коментарі бачить лише адміністратор.
privacy.s2.newsletter=<b>Новини e-mailом:</b> твій e-mail і дати підписки та підтвердження. Підписка почнеться лише після кліку на посилання в листі-підтвердженні, у кожному листі є посилання для відписки (згода).
privacy.s2.security=<b>Безпека:</b> IP-адреса коротко зберігається в пам'яті сервера для захисту від спаму та вгадування паролів і з'являється в технічних журналах сервера. Під час встановлення пароля ми перевіряємо, чи не був він у витоках даних (Have I Been Pwned): сервер залишають лише перші 5 символів хешу пароля, ніколи не пароль чи твої дані (законний інтерес – безпека).
privacy.s2.stats=<b>Підрахунок відвідувань (без cookies):</b> коли сторінка відкривається, сайт створює з твоєї IP-адреси й типу браузера (якщо ти увійшов – з номера облікового запису) анонімний відбиток. Його ключ щодня опівночі видаляється і створюється новий, тож за відбитком тебе не можна впізнати, а відвідування з різних днів не можна пов’язати. Він потрібен лише для чисел: скільки людей зараз на сайті, скільки прийшло за день і скільки разів прочитали текст пісні (кожен текст зараховується тобі щонайбільше раз на день). IP-адресу та браузер ми не зберігаємо (законний інтерес – огляд відвідуваності).
privacy.s3.t=Cookies і сховище браузера
privacy.s3.session=<b>Необхідний cookie входу</b> (JSESSIONID): без нього вхід не працює. Діє до закриття браузера, з «Запам'ятати на цьому пристрої» – 30 днів.
privacy.s3.storage=<b>Налаштування в браузері</b> (localStorage): твій вибір у смузі cookie, світла/темна тема, розмір тексту, стан плеєра Spotify і налаштування MC Kevin. Вони залишаються лише в твоєму браузері й не надсилаються на сервер.
privacy.s3.matomo=<b>Статистика відвідувань</b> через Matomo на сервері провайдера сайту (не в Google) – завантажується лише тоді, коли ти її дозволиш у панелі cookies («Прийняти все» або «Налаштувати» → Статистика відвідувань). До того на сервер статистики нічого не надсилається. Згоду можна будь-коли змінити або відкликати через «Налаштування cookies» внизу сторінки.
privacy.s4.t=Вміст інших сервісів
privacy.s4.p=Відео YouTube і плеєр Spotify завантажуються лише після твоєї згоди в смузі cookie або кліку на «Завантажити плеєр». Тоді YouTube (Google) чи Spotify бачать твою IP-адресу й діють за своїми правилами. Мініатюри кліпів, шрифти та іконки надходять з нашого сервера. Посилання на Instagram, Facebook, YouTube, Spotify і Apple Music ведуть на їхні сайти.
privacy.s5.t=Кому передаємо дані
privacy.s5.p=Ми їх ніколи не продаємо. Технічно їх обробляє оператор сервера й пошти, на якому працює сайт (хостинг у Чехії); листи (підтвердження облікового запису, відновлення пароля, новини) надсилаються через поштовий сервер.
privacy.s6.t=Як довго
privacy.s6.p=Обліковий запис і профіль – до видалення облікового запису. Підписка на новини – до відписки. Посилання для відновлення пароля діє 30 хвилин, підтвердження e-mail – 48 годин. Резервні копії бази даних служать лише для відновлення після збою.
privacy.s7.t=Видалення облікового запису
privacy.s7.p=У Налаштуваннях → Видалити обліковий запис. Видаляються ім'я, e-mail, пароль, фото профілю, профіль, обране, скарги й підписка на новини, і ти виходиш на всіх пристроях. Коментарі залишаються під позначкою «Видалений обліковий запис», голоси залишаються врахованими, але вже без зв'язку з тобою. Хочеш видалити й коментарі? Напиши на <a href="mailto:skelimc@seznam.cz">skelimc@seznam.cz</a>.
privacy.s8.t=Твої права
privacy.s8.p=Ти маєш право на доступ до своїх даних (Налаштування → Експорт даних (JSON)), їх виправлення (Налаштування), видалення, обмеження обробки, перенесення (завантаження у форматі JSON), заперечення й відкликання згоди. Скаргу можна подати до чеського Управління з захисту персональних даних (<a href="https://uoou.gov.cz" target="_blank" rel="noopener">uoou.gov.cz</a>).
privacy.s9.t=Вік
privacy.s9.p=Якщо тобі менше 15 років, попроси батьків дати згоду на реєстрацію.
