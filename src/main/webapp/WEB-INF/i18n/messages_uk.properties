email.newsletter.confirm.subject=Підтвердіть підписку на новини Skeli.cz
email.newsletter.confirm.body=Вітаємо!\n\nЦю адресу вказали для підписки на новини Skeli.cz. Підтвердіть підписку, перейшовши за посиланням (діє 48 годин):\n{link}\n\nЯкщо це були не ви, просто проігноруйте цей лист – без підтвердження ми більше нічого не надсилатимемо.\n\nSkeli

