email.register.subject=Ласкаво просимо на Skeli.cz — реєстрацію завершено
email.register.body=Ласкаво просимо на Skeli.cz!\n\nВаш обліковий запис «{username}» успішно створено.\n\nТепер ви можете увійти на нашому сайті:\n{link}\n\nДякуємо за реєстрацію — будемо раді бачити вас у нашій спільноті!\n\nЗ повагою,\nКоманда Skeli.cz
email.reset.subject=Skeli.cz — відновлення пароля
