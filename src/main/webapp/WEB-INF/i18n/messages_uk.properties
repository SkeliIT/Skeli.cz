# --- GDPR, конфіденційність, умови
privacy.heading=Політика конфіденційності
terms.heading=Умови використання
terms.updated=Діє з 8 жовтня 2026 року
terms.lead=Кілька чітких правил, щоб тут було добре всім – фанатам, критикам і Skeli.
terms.s1.t=Про сайт
terms.s1.p=skeli.cz – офіційний сайт Skeli. Його веде Радек Дворжак (Skeli), контакт <a href="mailto:skelimc@seznam.cz">skelimc@seznam.cz</a>. Читати тексти, слухати й дивитися можна без облікового запису; він потрібен лише для коментарів і голосування.
terms.s2.t=Твій обліковий запис
terms.s2.p=Одна людина = один обліковий запис. Вкажи e-mail, до якого маєш доступ, і нікому не давай пароль – за все, що написано з твого запису, відповідаєш ти. Якщо тобі менше 15 років, потрібна згода батьків. Запис можна будь-коли видалити в Налаштуваннях.
terms.s3.t=Правила спільноти
terms.s3.p=Критикувати творчість можна, цькувати людей – ні. У коментарях заборонено:
terms.rule1=спам, реклама й повторне вставлення одного тексту,
terms.rule2=образи, булінг і напади на інших людей,
terms.rule3=ненависть через походження, національність, релігію, стать, сексуальність, здоров’я тощо,
terms.rule4=погрози й заклики до насильства,
terms.rule5=публікація чужих особистих даних (адреса, телефон, фото…) – так званий доксинг,
terms.rule6=незаконний вміст і посилання на шахрайські чи шкідливі сайти,
terms.rule7=видавання себе за іншу людину (наприклад, за Skeli).
terms.s4.t=Скарги й модерація
terms.s4.p=Коментар, що порушує правила, познач кнопкою біля нього. Скарги бачить лише адміністратор і вирішує: коментар залишиться, буде змінений або видалений. За серйозні чи повторні порушення може бути видалений і обліковий запис. Не згоден із рішенням? Напиши на <a href="mailto:skelimc@seznam.cz">skelimc@seznam.cz</a>, і ми переглянемо його.
terms.s5.t=Твої коментарі
terms.s5.p=Те, що ти пишеш, залишається твоїм. Надсилаючи коментар, ти погоджуєшся, що він буде публічно показаний на сайті. Свої коментарі можна редагувати або видаляти. Після видалення облікового запису коментарі залишаються з позначкою «Видалений обліковий запис»; якщо хочеш видалити й їх, напиши нам.
terms.s6.t=Вміст сайту
terms.s6.p=Музика, тексти пісень, кліпи, фото й логотип належать Skeli (або співавторам). Посиланнями ділися як завгодно; копіювати й поширювати цілі тексти, фото чи записи можна лише з його згоди.
terms.s7.t=Послуги інших компаній
terms.s7.p=Відео, музика й посилання ведуть на YouTube, Spotify, Apple Music, Instagram і Facebook. Вони мають власні умови; як сайт із ними працює, описано в <a href="/privacy.jsp">Політиці конфіденційності</a>.
terms.s8.t=Без гарантій
terms.s8.p=Ми робимо сайт із любов’ю, але без гарантії, що він завжди працюватиме без помилок. Функції можуть змінюватися, з’являтися й зникати.
terms.s9.t=Зміни умов
terms.s9.p=Коли правила зміняться, ми оновимо дату вгорі сторінки. Про більші зміни повідомимо на сайті.

