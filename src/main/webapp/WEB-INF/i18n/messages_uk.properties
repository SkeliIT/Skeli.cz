privacy.p1=Цей сайт обробляє лише дані, необхідні для роботи облікового запису (ім’я користувача, хеш пароля). Паролі зберігаємо як bcrypt-хеш. Коментарі є публічними.
privacy.p2=Зовнішні платформи (YouTube, Spotify) завантажуються лише після вашої згоди. Змінити згоду можна будь-коли, видаливши запис «cookieConsent» у сховищі браузера.
