email.verify.body=Привіт, {username}!\n\nДякуємо за реєстрацію на Skeli.cz! Підтверди, будь ласка, свій e-mail, перейшовши за посиланням (діє 48 годин):\n{link}\n\nЯкщо ти не реєструвався(-лася), просто проігноруй цей лист.\n\nSkeli
about.intro1=Мене звати Радек Дворжак, 1992 року народження. 🦖
about.intro2=Як музикант я виступаю під ім'ям Skeli і займаюся музикою з п'ятнадцяти років.
about.selftaught.text=Я чеський репер/співак і насамперед самоук. У мене немає музичної школи чи будь-якої формальної музичної освіти. Усього я поступово навчився сам – від написання текстів через запис до роботи зі звуком і створення відео. І досі вчуся далі, бо мені здається, що в музиці людина ніколи не доходить до точки, коли вже знає все.
about.work.text=Поза музикою я спочатку працював сантехніком. Спробував також кілька заводів, які досить швидко показали мені одну важливу річ:
about.work.quote=Завод – точно ні.
about.why.p1=Музика для мене – передусім спосіб зафіксувати те, що людина переживає, про що думає або що просто не хоче пропустити повз голову. Іноді це історія, іноді настрій, іноді звичайна життєва ситуація, а іноді те, що мене добряче розізлить. Тож кожен трек може з'явитися з зовсім іншої причини.
about.why.p2=Я не відчуваю потреби триматися однієї теми чи одного стилю. Мені подобається пробувати нове й рухатися далі – чи то саме письмо, запис, звук, відеокліп, чи вся подача музики.
about.squad.p1=Велика частина мого шляху – це також Skelo Squad.
about.squad.p2=Skelo Squad – це не просто назва, яку я ставлю в кінці своїх дописів. Це моя мрія з часом збудувати власний музичний лейбл, під яким могли б виступати й інші артисти, і разом створювати щось більше.
about.squad.p3=Поки що Skelo Squad – маленька команда: я і моя дівчина, з якою ми разом уже понад десять років. Вона допомагає мені з соцмережами, відеокліпами і взагалі стоїть за багатьма речами, яких не видно з першого погляду.
about.squad.p4=Тож, можливо, ми поки що не великий лейбл.
about.squad.p5=Але кожен десь починає.
about.squad.p6=І саме тому я хочу поступово будувати Skelo Squad далі – як місце для власної творчості, співпраці, а колись, можливо, і для інших артистів, які захочуть стати його частиною.
about.outro=Я Skeli. Це моя музика, мій шлях і початок Skelo Squad. 🖤
about.signature=Skelo Squad.
about.music.title=Музичний шлях
about.music.text=Від перших треків до теперішніх робіт. Кліпи та плейлисти — на сторінці Музика.
about.collab.title=Співпраця
about.collab.text=Якщо тобі подобається моя творчість — напиши. Вітаю фіти, продакшн бітів і візуал.
