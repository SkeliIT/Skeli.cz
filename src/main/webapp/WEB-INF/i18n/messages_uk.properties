email.verify.body=Привіт, {username}!\n\nДякуємо за реєстрацію на Skeli.cz! Підтверди, будь ласка, свій e-mail, перейшовши за посиланням (діє 48 годин):\n{link}\n\nЯкщо ти не реєструвався(-лася), просто проігноруй цей лист.\n\nSkeli
about.intro1=Мене звати Радек Дворжак, 1992 року народження. 🦖 У музиці я виступаю під іменем <strong>Skeli</strong> і займаюся музикою з п’ятнадцяти років.
about.selftaught.text=Я самоук. Усього я навчився сам, крок за кроком – від написання текстів, запису й роботи зі звуком аж до створення відеокліпів. Мені подобається експериментувати, шукати власне звучання й пробувати нове. Не хочу триматися однієї шухляди. Кожна пісня має свою історію і причину, чому вона з’явилася.
about.web.text=Тим самим шляхом я пішов і поза музикою. <strong>Skeli.cz я створив сам</strong>, бо хотів мати власний простір, де можу показати свою творчість так, як я її бачу. Від перших ідей до самої роботи сайту – це ще одна частина мого проєкту, яку я будую власними руками.
about.squad.title=Skelo Squad 🖤
about.squad.p1=Моя мрія – створити власний музичний лейбл під назвою <strong>Skelo Squad</strong>. Місце, де народжуватимуться нові проєкти, співпрацюватимуть артисти й разом створюватимуть щось більше.
about.squad.p2=Поки що ми на самому початку. Я створюю його разом зі своєю дівчиною Енді, яка допомагає мені із соцмережами, відеокліпами та іншими справами навколо моєї творчості, а також із котом {kevin}Кевіном{/kevin}, який став талісманом і помічником тут, на сайті. 🐈
about.kevin.alt=Кіт Кевін
about.squad.p3=Я досі вчуся, шукаю нові можливості й рухаюся далі. Не хочу зупинятися на ідеях. Хочу поступово втілювати їх у життя.
about.outro=<strong>Я Skeli. Це моя музика, моє бачення і світ, який я будую по-своєму.</strong> 🤘
about.signature=Skelo Squad.
