# --- GDPR, конфіденційність, умови
privacy.heading=Політика конфіденційності
terms.heading=Умови використання
terms.updated=Діє з 5 листопада 2026 року
terms.lead=Кілька простих правил, щоб на skeli.cz було добре всім.
terms.s1.t=Про сайт
terms.s1.p=Skeli.cz — офіційний сайт репера Skeli, який веде Радек Дворжак. Написати мені можна на <a href="mailto:skelimc@seznam.cz">skelimc@seznam.cz</a>. Музику, відео й тексти можна переглядати без реєстрації. Деякі функції, наприклад коментарі, голосування, повідомлення чи караоке, потребують облікового запису.
terms.s2.t=Твій обліковий запис
terms.s2.p=Кожен може мати лише один обліковий запис. Реєструйся з e-mail, до якого маєш доступ, і нікому не давай свій пароль. Якщо підозрюєш, що хтось зловживав твоїм обліковим записом, зміни пароль і напиши мені. Якщо тобі ще немає 15 років, для реєстрації потрібна згода батьків або законного представника. Обліковий запис можна будь-коли видалити в Налаштуваннях. У «Мою творчість» додавай лише треки, які створив ти або на які маєш потрібні права. Трек, що порушує права інших, я можу приховати. Правила пристойної поведінки діють і в особистих повідомленнях. За серйозні чи повторні порушення правил обліковий запис можуть заблокувати або видалити.
terms.s3.t=Правила спільноти
terms.s3.p=Музику й думки інших можна критикувати, але особистим нападам тут не місце. У коментарях, повідомленнях, у профілі, на фото профілю, в обкладинці профілю та в «Моїй творчості» заборонено:
terms.rule1=спам, небажана реклама та повторне публікування того самого вмісту,
terms.rule2=образи, цькування та цілеспрямоване переслідування інших,
terms.rule3=ненависть до людей через походження, національність, віру, стать, сексуальну орієнтацію, здоров’я чи подібне,
terms.rule4=погрози, заклики до насильства та його вихваляння,
terms.rule5=оприлюднення чужих особистих даних без дозволу, наприклад адреси, телефону чи приватних фото,
terms.rule6=незаконний вміст і посилання на шахрайські або шкідливі сайти,
terms.rule7=видавання себе за іншу людину, наприклад за Skeli,
terms.rule8=пропонування чи пошук наркотиків, зброї та інших незаконних речей,
terms.rule9=порнографія та сексуальний вміст. Вміст, що зображує сексуальне насильство над дітьми, та інші підозри на тяжкі злочини щодо дітей розглядаємо першочергово. У випадках, визначених законом, повідомляємо компетентні органи, в інших випадках можемо повідомити їм про підозру.
terms.s4.t=Скарги й модерація
terms.s4.p=Коментар, профіль або повідомлення, що порушують правила, можна поскаржитися кнопкою поруч із ними. Скаргу розгляне адміністратор і залежно від ситуації залишить, відредагує або видалить вміст. Трек у «Моїй творчості» він може приховати. За серйозні чи повторні порушення він може заблокувати або видалити обліковий запис. Незаконний вміст і підозру на загрозу дитині розглядаємо першочергово; коли ми повідомляємо компетентні органи, описано в останньому пункті Правил спільноти вище. Особисті повідомлення адміністратор зазвичай не читає, в адмініструванні бачить лише повідомлення, на яке хтось поскаржився. Як захищені повідомлення, описано в <a href="/privacy.jsp">Політиці конфіденційності</a>. Для скарг і для зв’язку з боку органів влади слугує <a href="mailto:skelimc@seznam.cz">skelimc@seznam.cz</a> (чеською або англійською). Якщо не згоден із рішенням, напиши на ту саму адресу й попроси переглянути його.
terms.s5.t=Твої коментарі
terms.s5.p=Те, що ти напишеш, лишається твоїм. Надсилаючи коментар, ти погоджуєшся, що він публічно відображатиметься на сайті. Свій коментар можна редагувати або видалити. Якщо видалиш обліковий запис, коментарі лишаться з позначкою «Видалений обліковий запис» і без зв’язку з твоїм профілем. Якщо хочеш видалити і їх, напиши на <a href="mailto:skelimc@seznam.cz">skelimc@seznam.cz</a>.
terms.s6.t=Вміст сайту
terms.s6.p=Музика, тексти пісень, відео, фото й логотип належать Skeli або співавторам та іншим правовласникам. Посиланнями на творчість ділися скільки завгодно. Копіювати й поширювати цілі тексти, фото чи записи можна лише з дозволу правовласника, якщо закон прямо не дозволяє інакше.
terms.s7.t=Послуги інших компаній
terms.s7.p=На сайті є вміст і посилання з YouTube, Spotify, Apple Music, SoundCloud, Instagram і Facebook, а увійти можна й через Google. Ці сервіси мають власні умови й правила. Як сайт із ними працює, описано в <a href="/privacy.jsp">Політиці конфіденційності</a>.
terms.s8.t=Без гарантій
terms.s8.p=Я стараюся, щоб сайт працював якнайкраще, але можуть трапитися помилки чи збої. Функції з часом можуть змінюватися, з’являтися й зникати. Це не обмежує прав, які тобі дає закон.
terms.s9.t=Зміни умов
terms.s9.p=Коли умови зміняться, ми опублікуємо нову редакцію та дату, з якої вона діє. Про важливі зміни повідомимо на сайті.

