forgot.sentTitle=Лист уже в дорозі
forgot.sentText=Якщо до цього імені чи e-mailу належить обліковий запис, ми надіслали на нього посилання для нового пароля. Посилання дійсне 30 хвилин.
mail.spamHint=Не бачиш його за кілька хвилин? Заглянь у папку «Спам» і познач лист як «Не спам» – наступного разу він прийде одразу.
