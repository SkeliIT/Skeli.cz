privacy.s2.chat=<b>Повідомлення (необов’язково):</b> текст, час, хто кому писав і чи прочитано повідомлення. Ми зберігаємо їх, щоб ви могли їх читати. У базі даних текст зашифрований, і в адмінпанелі сайту його прочитати не можна; адміністратор бачить лише те, на яке хтось поскаржився. Це не шифрування між двома пристроями: адміністратор сервера, який має ще й ключ, технічно міг би до них дістатися. Через рік повідомлення видаляються самі. Своє повідомлення або всю розмову можна видалити будь-коли; розмова зникне в тебе, а коли її видалить і друга людина, зникне повністю. З видаленням акаунта зникнуть усі твої розмови. Копія повідомлення, на яке поскаржилися, залишається, доки адміністратор не вирішить скаргу, а потім щонайбільше рік. Посилання з YouTube, Spotify, Apple Music або SoundCloud отримує у повідомленні картку. Програвач завантажується лише після натискання, і тільки тоді цей сервіс бачить твою IP-адресу. Якщо повідомлення схоже на пропозицію наркотиків, зброї чи оголених фото, браузер попередить тебе перед надсиланням. Це відбувається лише в тебе, нікуди нічого не надсилається і ніхто про це не дізнається.
