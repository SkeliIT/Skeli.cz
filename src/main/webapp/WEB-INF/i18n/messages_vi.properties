privacy.s2.google=<b>Đăng nhập bằng Google (không bắt buộc):</b> khi bạn đăng nhập bằng Google, chúng tôi nhận từ Google tên, e-mail, ảnh đại diện và số tài khoản Google của bạn để lần sau nhận ra bạn. Chúng tôi không bao giờ thấy mật khẩu Google của bạn (hợp đồng – điều khoản sử dụng).
