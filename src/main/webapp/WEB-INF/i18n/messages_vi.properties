tfa.lead=Ngoài mật khẩu, khi đăng nhập bạn còn nhập mã từ ứng dụng trên điện thoại (Google Authenticator, Microsoft Authenticator, Aegis…). Người chỉ biết mật khẩu của bạn sẽ không vào được tài khoản.
