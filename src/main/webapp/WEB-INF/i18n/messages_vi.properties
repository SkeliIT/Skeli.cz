about.intro1=Tôi tên là Radek Dvořák, sinh năm 1992. 🦖
about.intro2=Tôi làm nhạc với nghệ danh Skeli và đã gắn bó với âm nhạc từ năm mười lăm tuổi.
about.selftaught.text=Tôi là một rapper/ca sĩ người Séc và trên hết là người tự học. Tôi chưa từng học trường nhạc và không được đào tạo âm nhạc bài bản. Tôi tự học dần mọi thứ – từ viết lời, thu âm cho đến xử lý âm thanh và làm video. Và tôi vẫn đang tiếp tục học, vì tôi cảm thấy trong âm nhạc, không bao giờ có lúc mình biết hết mọi thứ.
about.work.text=Ngoài âm nhạc, trước đây tôi làm thợ ống nước. Tôi cũng đã thử làm ở vài nhà máy, và chúng nhanh chóng dạy tôi một điều quan trọng:
about.work.quote=Nhà máy? Chắc chắn là không.
about.why.p1=Với tôi, âm nhạc trước hết là cách để ghi lại những điều mình đã trải qua, suy nghĩ, hoặc đơn giản là không muốn để chúng trôi tuột khỏi đầu. Đôi khi là một câu chuyện, đôi khi là một tâm trạng, đôi khi là một tình huống đời thường, và đôi khi là điều thực sự khiến tôi bực mình. Vì vậy, mỗi bài hát có thể đến từ một nơi hoàn toàn khác nhau.
about.why.p2=Tôi không thấy cần phải bó mình vào một chủ đề hay một phong cách. Tôi thích thử những điều mới và tiến về phía trước – dù đó là chính việc viết lời, thu âm, âm thanh, video ca nhạc hay toàn bộ cách âm nhạc được giới thiệu.
about.squad.p1=Một phần quan trọng trong hành trình của tôi còn là Skelo Squad.
about.squad.p2=Skelo Squad không chỉ là cái tên tôi ghi ở cuối các bài đăng. Đó là ước mơ của tôi: một ngày nào đó xây dựng hãng thu âm riêng, nơi các nghệ sĩ khác có thể ra mắt âm nhạc của mình và chúng tôi cùng nhau tạo nên điều gì đó lớn hơn.
about.squad.p3=Hiện tại Skelo Squad vẫn là một nhóm nhỏ: tôi và bạn gái tôi, người đã ở bên tôi hơn mười năm. Cô ấy giúp tôi với mạng xã hội, video ca nhạc và đứng sau rất nhiều điều mà thoạt nhìn bạn không thấy.
about.squad.p4=Vậy nên có lẽ chúng tôi chưa phải là một hãng thu âm lớn.
about.squad.p5=Nhưng ai rồi cũng phải bắt đầu từ đâu đó.
about.squad.p6=Và chính vì thế tôi muốn tiếp tục xây dựng Skelo Squad từng bước một – như một nơi cho những sáng tác của riêng tôi, cho sự hợp tác, và biết đâu một ngày nào đó cho cả những nghệ sĩ khác muốn trở thành một phần của nó.
about.outro=Tôi là Skeli. Đây là âm nhạc của tôi, hành trình của tôi và là khởi đầu của Skelo Squad. 🖤
