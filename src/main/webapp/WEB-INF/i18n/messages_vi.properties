privacy.updated=Có hiệu lực từ ngày 5/11/2026
privacy.lead=Tại đây bạn sẽ biết skeli.cz xử lý những dữ liệu cá nhân nào, vì sao, lưu giữ bao lâu và bạn có những quyền gì.
privacy.s1.t=Ai chịu trách nhiệm
privacy.s1.p=Bên kiểm soát dữ liệu cá nhân là Radek Dvořák (Skeli). Về các câu hỏi quyền riêng tư, hãy viết cho mình qua <a href="mailto:skelimc@seznam.cz">skelimc@seznam.cz</a>. Bạn cũng có thể gửi yêu cầu truy cập, sửa hoặc xóa dữ liệu tới cùng địa chỉ.
privacy.s2.t=Chúng tôi xử lý gì và vì sao
privacy.s2.account=<b>Tài khoản:</b> tên người dùng, e-mail, mật khẩu (chỉ dưới dạng mã băm bcrypt, chúng mình không biết mật khẩu thật), ngày đăng ký và xác nhận e-mail. Dùng để vận hành tài khoản và các tính năng cho người đã đăng nhập, ví dụ bình luận và bình chọn (thực hiện hợp đồng, tức điều khoản sử dụng).
privacy.s2.profile=<b>Hồ sơ (không bắt buộc):</b> tên hiển thị, tuổi, thành phố, vài dòng giới thiệu, ảnh hồ sơ, ảnh bìa hồ sơ, giao diện và ngôn ngữ trang web. Bạn chỉ điền những gì muốn và có thể sửa hoặc xóa bất cứ lúc nào (đồng ý). Chỉ bạn thấy lời mời kết bạn và những người bạn đã chặn. Người đăng nhập khác có thấy thành phố, vài dòng giới thiệu, bài hát được thả tim, bạn bè, trạng thái trực tuyến hay hoạt động gần đây của bạn hay không là do bạn quyết định trong Cài đặt → Quyền riêng tư. Nếu bạn thêm sáng tác của mình, chúng mình lưu tên, năm và liên kết tới các bài; người đăng nhập khác sẽ thấy cho tới khi bạn tắt. Nếu bạn mở hồ sơ cho cả người chưa đăng nhập, bất kỳ ai có liên kết sẽ thấy tên, ảnh, phần giới thiệu và các bài của bạn. Chúng mình không đưa hồ sơ như vậy cho công cụ tìm kiếm (yêu cầu chúng không lập chỉ mục), nhưng không thể đảm bảo liên kết sẽ không xuất hiện ở đâu đó.
privacy.s2.comments=<b>Bình luận và bình chọn:</b> nội dung bình luận, ngày và các lượt bình chọn cho bài hát và bình luận. Bình luận là công khai, kèm tên tác giả. Chỉ quản trị viên thấy các báo cáo bình luận.
privacy.s2.newsletter=<b>Tin mới qua e-mail:</b> e-mail của bạn và ngày đăng ký, xác nhận. Việc đăng ký chỉ bắt đầu sau khi bạn nhấp vào liên kết trong e-mail xác nhận, và mỗi e-mail đều có liên kết hủy đăng ký (đồng ý).
privacy.s2.security=<b>Bảo mật:</b> chúng mình giữ địa chỉ IP của bạn trong thời gian ngắn trong bộ nhớ máy chủ để chống spam và đoán mật khẩu; nếu khoảng một ngày không có lần thử nào nữa từ địa chỉ đó, nó sẽ bị quên. Địa chỉ IP cũng xuất hiện trong nhật ký kỹ thuật của máy chủ. Khi bạn đặt mật khẩu, chúng mình kiểm tra qua dịch vụ Have I Been Pwned xem mật khẩu có bị lộ từ trang khác không: chỉ 5 ký tự đầu của mã băm SHA-1 được gửi đi, không bao giờ gửi mật khẩu hay dữ liệu của bạn (lợi ích chính đáng – bảo mật).
privacy.s2.stats=<b>Đếm lượt truy cập (không dùng cookie):</b> khi một trang được hiển thị, trang web tính một dấu vết hằng ngày từ địa chỉ IP và loại trình duyệt (với người đã đăng nhập thì từ số tài khoản) bằng một khóa ngẫu nhiên của ngày. Mỗi ngày lúc nửa đêm, khóa được thay bằng khóa mới, nên dấu vết của các ngày khác nhau không thể nối với nhau. Nhưng trong ngày, khi khóa còn hiệu lực, dấu vết của người đã đăng nhập có thể bị nối với tài khoản của họ, vì vậy chúng mình không coi nó là ẩn danh. Chỉ lưu ngày và dấu vết, không lưu địa chỉ IP hay loại trình duyệt. Chỉ dùng cho các con số: bao nhiêu người đang ở trên trang, bao nhiêu người đến trong ngày và lời bài hát được đọc bao nhiêu lần. Dấu vết của những ngày đã qua bị xóa vào ngày hôm sau, chỉ còn lại số người mỗi ngày (lợi ích chính đáng – nắm tình hình truy cập).
privacy.s2.plays=<b>Thứ được nghe nhiều nhất (không dùng cookie):</b> cùng dấu vết hằng ngày được dùng để đếm số lần mở lời bài hát, bật video và vào rạp karaoke. Mỗi thứ chỉ được tính cho bạn tối đa một lần mỗi ngày, kể cả khi bạn đăng nhập trong lúc truy cập. Dấu vết ở từng bài hát và video bị xóa ngay ngày hôm sau, chỉ còn lại tổng số. Dùng cho các bảng tổng quan trong trang quản trị (lợi ích chính đáng – biết mọi người thích gì).
privacy.s2.reports=<b>Báo lỗi cho Kevin (không bắt buộc):</b> nội dung bạn viết và địa chỉ trang bạn đang xem; nếu đã đăng nhập thì cả tài khoản của bạn. Chúng tôi không lưu địa chỉ IP. Chỉ quản trị viên xem được và sẽ xóa báo cáo khi đã sửa xong lỗi (lợi ích hợp pháp – sửa lỗi của web).
privacy.s2.help=<b>Bổ sung đoạn lời bài hát còn thiếu (không bắt buộc):</b> nội dung bạn viết; nếu đã đăng nhập thì cả tài khoản của bạn. Chúng tôi không lưu địa chỉ IP. Chỉ quản trị viên xem được và sẽ xóa sau khi xử lý (lợi ích hợp pháp – lời bài hát đầy đủ).
privacy.s2.marketing=<b>Khách đến từ đâu (thống kê):</b> khi bắt đầu lượt truy cập, chúng tôi chỉ đếm tên trang web bạn đến từ đó (ví dụ instagram.com – không lấy gì thêm từ địa chỉ), nhãn chiến dịch trong liên kết (ví dụ ?z=ig-bio), loại thiết bị (điện thoại / máy tính bảng / máy tính), ngôn ngữ trang và giờ. Tương tự, chúng tôi chỉ đếm số lần bấm vào liên kết Spotify, Apple Music, YouTube và mạng xã hội, cùng các từ tìm kiếm trong mục Lời bài hát (xóa sau 90 ngày). Chỉ lưu tổng số theo ngày – không cookie, không địa chỉ IP, không gì trong đó liên kết được với bạn (lợi ích hợp pháp – biết người hâm mộ đến từ đâu và quan tâm điều gì).
privacy.s2.trash=<b>Thùng rác trong trang quản trị:</b> khi quản trị viên xóa một bình luận (hoặc một bài hát hay video cùng các bình luận bên dưới), bản sao sẽ ở trong thùng rác 30 ngày để có thể hoàn tác nếu nhầm; sau đó bị xóa vĩnh viễn. Bình luận do chính bạn xóa sẽ không được giữ lại (lợi ích hợp pháp – phòng tránh nhầm lẫn).
privacy.s2.social=<b>Bạn bè và thông báo:</b> lời mời kết bạn, danh sách bạn bè và người bị chặn, và các thông báo ở chuông (trả lời, tim, lời mời, tin nhắn, CatSmash). Người bị chặn không hề biết điều đó và bạn không nhận được thông báo nào từ họ. Chỉ quản trị viên thấy báo cáo về hồ sơ hoặc bình luận (ai báo cáo ai, lý do và ghi chú).
privacy.s2.games=<b>CatSmash và huy hiệu:</b> kết quả các trận đấu với Kevin (thời gian, điểm, độ khó), kỷ lục, huy hiệu đã đạt, khung hoặc dấu hiệu bạn chọn bên cạnh tên và huy hiệu của trang web (cho bình luận, bạn bè, karaoke và tương tự). Kết quả nằm trong bảng kỷ lục mà ai cũng xem được. Người khác chỉ thấy tên và ảnh của bạn ở đó khi bạn bật “Tên tôi trong bảng CatSmash” trong Cài đặt → Quyền riêng tư. Nếu không, bạn là người chơi ẩn danh ở đó và hồ sơ của bạn không cho người khác thấy thời gian hay thứ hạng trong bảng.
privacy.s2.rewards=<b>Giao diện và phần thưởng:</b> những ngày bạn đã đăng nhập vào trang web (chỉ ngày, không có giờ và không có việc bạn đã làm), những phần thưởng bạn đã mở khóa và giao diện bạn đã chọn (giao diện hồ sơ, phông chữ và phong cách karaoke). Số ngày chỉ dùng để mở khóa phần thưởng. Dữ liệu này bị xóa cùng tài khoản và có trong bản xuất dữ liệu.
privacy.s2.tfa=<b>Xác thực hai bước (không bắt buộc):</b> khóa cho ứng dụng trên điện thoại được lưu ở dạng mã hóa, còn mã dự phòng chỉ lưu dưới dạng mã băm. Chúng chỉ dùng để đăng nhập.
privacy.s3.t=Cookie và bộ nhớ trình duyệt
privacy.s3.session=<b>Cookie đăng nhập cần thiết</b> (JSESSIONID): không có nó thì không đăng nhập được. Có hiệu lực đến khi đóng trình duyệt, 30 ngày nếu chọn “Ghi nhớ trên thiết bị này”.
privacy.s3.known=<b>Thiết bị quen</b> (skeliKnown): sau khi đăng nhập thành công, trình duyệt ghi nhớ số tài khoản của bạn kèm chữ ký trong một năm. Nếu người lạ cố đoán mật khẩu của bạn và vì thế việc đăng nhập vào tài khoản tạm thời bị chặn, bạn vẫn đăng nhập được từ thiết bị của mình. Bản thân cookie không mở được gì, luôn cần mật khẩu (lợi ích chính đáng – bảo mật).
privacy.s3.storage=<b>Cài đặt trong trình duyệt</b> (localStorage và sessionStorage): lựa chọn của bạn ở thanh cookie, chế độ sáng hoặc tối, phông chữ và cỡ chữ, cài đặt karaoke, hiệu ứng và âm thanh, cài đặt của Kevin và trò chơi CatSmash (kỷ lục trên máy và những thứ đã mở khóa). Chúng ở lại trong trình duyệt của bạn và không tự gửi lên máy chủ. Ngoại lệ là huy hiệu từ trận CatSmash, trò chơi sẽ lưu chúng vào tài khoản của bạn.
privacy.s4.t=Nội dung từ dịch vụ khác
privacy.s4.p=Video YouTube và trình phát Spotify chỉ tải sau khi bạn đồng ý ở thanh cookie hoặc nhấp “Tải trình phát”. Khi đó YouTube (Google) hoặc Spotify thấy địa chỉ IP của bạn và tuân theo chính sách của họ. Ảnh xem trước, phông chữ và biểu tượng được gửi từ máy chủ của chúng tôi. Liên kết tới Instagram, Facebook, YouTube, Spotify và Apple Music dẫn tới trang của họ.
privacy.s5.t=Dữ liệu được chuyển cho ai
privacy.s5.p=Chúng tôi không bao giờ bán dữ liệu. Về mặt kỹ thuật, dữ liệu được xử lý bởi đơn vị vận hành máy chủ và thư điện tử nơi trang chạy (hosting tại Séc); e-mail (xác nhận tài khoản, đặt lại mật khẩu, tin mới) được gửi qua máy chủ thư.
privacy.s6.t=Trong bao lâu
privacy.s6.p=Tài khoản và hồ sơ cho tới khi xóa tài khoản. Bản tin cho tới khi hủy đăng ký. Liên kết đặt lại mật khẩu có hiệu lực 30 phút, xác nhận e-mail 48 giờ. Tin nhắn, báo cáo và thống kê có thời hạn riêng như mô tả ở trên. Bản sao lưu cơ sở dữ liệu chỉ dùng để khôi phục sau sự cố.
privacy.s6.more=Báo lỗi cho đến khi được xử lý. Đánh giá của bạn về web cho đến khi bạn xóa tài khoản.
privacy.s7.t=Xóa tài khoản
privacy.s7.p=Trong Cài đặt → Xóa tài khoản. Tên, e-mail, mật khẩu, đăng nhập Google, xác thực hai bước, ảnh hồ sơ, ảnh bìa hồ sơ, hồ sơ, sáng tác, bạn bè và người bị chặn, thông báo, tin nhắn, kết quả trò chơi và huy hiệu, đánh giá trang web và đăng ký bản tin sẽ bị xóa, và bạn sẽ bị đăng xuất trên mọi thiết bị. Bình luận vẫn còn với nhãn “Tài khoản đã xóa” và lượt bình chọn vẫn được tính, nhưng không còn liên kết với bạn. Báo cáo bạn đã gửi sẽ bị xóa khi quản trị viên xử lý xong. Báo cáo về tài khoản hoặc tin nhắn của bạn được giữ làm bằng chứng cho tới khi xử lý xong và sau đó tối đa một năm (lợi ích chính đáng – bảo vệ người dùng khác). Muốn xóa cả bình luận? Hãy viết tới <a href="mailto:skelimc@seznam.cz">skelimc@seznam.cz</a>.
privacy.s8.t=Quyền của bạn
privacy.s8.p=Bạn có quyền truy cập và sửa dữ liệu của mình, và theo các điều kiện luật định còn có quyền xóa, hạn chế xử lý và chuyển dữ liệu. Bạn có thể phản đối và rút lại sự đồng ý mà không ảnh hưởng tới việc xử lý trước khi rút lại. Bạn tải dữ liệu của mình trong Cài đặt → Xuất dữ liệu (JSON) và sửa hồ sơ ngay trong Cài đặt. Hãy gửi yêu cầu tới <a href="mailto:skelimc@seznam.cz">skelimc@seznam.cz</a>. Bạn có thể khiếu nại tới Cơ quan Bảo vệ Dữ liệu Cá nhân của Séc (<a href="https://uoou.gov.cz" target="_blank" rel="noopener">uoou.gov.cz</a>).
privacy.s9.t=Độ tuổi
privacy.s9.p=Nếu bạn chưa đủ 15 tuổi, bạn cần sự đồng ý của cha mẹ hoặc người giám hộ hợp pháp để đăng ký.
