about.intro1=Tôi tên là Radek Dvořák, sinh năm 1992. 🦖 Tôi làm nhạc với nghệ danh <strong>Skeli</strong> và đã gắn bó với âm nhạc từ năm mười lăm tuổi.
about.selftaught.text=Tôi là người tự học. Mọi thứ tôi đều tự học từng bước – từ viết lời, thu âm và xử lý âm thanh cho đến làm video ca nhạc. Tôi thích thử nghiệm, tìm âm thanh riêng và thử những điều mới. Tôi không muốn bó mình trong một khuôn khổ. Mỗi bài hát đều có câu chuyện riêng và lý do ra đời của nó.
about.web.text=Ngoài âm nhạc, tôi cũng đi theo con đường ấy. <strong>Tôi tự xây dựng Skeli.cz</strong>, vì tôi muốn có một không gian của riêng mình, nơi tôi giới thiệu tác phẩm theo cách mình muốn. Từ những ý tưởng đầu tiên đến cách trang web vận hành, đây là một phần khác của dự án mà tôi tự tay xây dựng.
about.squad.title=Skelo Squad 🖤
about.squad.p1=Ước mơ của tôi là xây dựng một hãng nhạc riêng mang tên <strong>Skelo Squad</strong>. Một nơi để những dự án mới ra đời, các nghệ sĩ cùng hợp tác và tạo nên điều gì đó lớn hơn.
about.squad.p2=Hiện tại chúng tôi mới chỉ bắt đầu. Tôi xây dựng nó cùng bạn gái Andy, người giúp tôi về mạng xã hội, video ca nhạc và nhiều việc khác quanh âm nhạc của tôi.
about.squad.p3=Tôi vẫn đang học hỏi, tìm kiếm cơ hội mới và tiến về phía trước. Tôi không muốn chỉ dừng lại ở ý tưởng. Tôi muốn từng bước biến chúng thành hiện thực.
about.outro=<strong>Tôi là Skeli. Đây là âm nhạc của tôi, tầm nhìn của tôi và thế giới tôi xây dựng theo cách riêng.</strong> 🤘
