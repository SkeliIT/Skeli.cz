# --- GDPR, privacy, terms
privacy.heading=Chính sách quyền riêng tư
terms.heading=Điều khoản sử dụng
terms.updated=Có hiệu lực từ ngày 8/10/2026
terms.lead=Vài quy tắc rõ ràng để mọi người đều thấy thoải mái ở đây – người hâm mộ, người phê bình và Skeli.
terms.s1.t=Về trang web
terms.s1.p=skeli.cz là trang web chính thức của Skeli, do Radek Dvořák (Skeli) vận hành, liên hệ <a href="mailto:skelimc@seznam.cz">skelimc@seznam.cz</a>. Bạn có thể đọc lời bài hát, nghe và xem mà không cần tài khoản; tài khoản chỉ cần để bình luận và bình chọn.
terms.s2.t=Tài khoản của bạn
terms.s2.p=Một người = một tài khoản. Dùng e-mail bạn truy cập được và đừng đưa mật khẩu cho ai – bạn chịu trách nhiệm về những gì được viết từ tài khoản của mình. Nếu dưới 15 tuổi, bạn cần sự đồng ý của cha mẹ. Bạn có thể xóa tài khoản bất cứ lúc nào trong Cài đặt.
terms.s3.t=Quy tắc cộng đồng
terms.s3.p=Phê bình âm nhạc thì được, công kích con người thì không. Trong bình luận cấm:
terms.rule1=spam, quảng cáo và đăng lặp lại cùng một nội dung,
terms.rule2=xúc phạm, bắt nạt và tấn công người khác,
terms.rule3=thù ghét vì nguồn gốc, quốc tịch, tôn giáo, giới tính, xu hướng tình dục, sức khỏe hoặc tương tự,
terms.rule4=đe dọa và kêu gọi bạo lực,
terms.rule5=công khai thông tin cá nhân của người khác (địa chỉ, điện thoại, ảnh…) – gọi là doxxing,
terms.rule6=nội dung bất hợp pháp và liên kết đến trang lừa đảo hoặc độc hại,
terms.rule7=mạo danh người khác (ví dụ Skeli).
terms.s4.t=Báo cáo và kiểm duyệt
terms.s4.p=Hãy báo cáo bình luận vi phạm quy tắc bằng nút bên cạnh. Chỉ quản trị viên thấy báo cáo và quyết định: giữ, chỉnh sửa hoặc xóa bình luận. Với vi phạm nghiêm trọng hoặc lặp lại, tài khoản cũng có thể bị xóa. Không đồng ý với quyết định? Hãy viết tới <a href="mailto:skelimc@seznam.cz">skelimc@seznam.cz</a>, chúng tôi sẽ xem xét lại.
terms.s5.t=Bình luận của bạn
terms.s5.p=Những gì bạn viết vẫn là của bạn. Khi gửi, bạn đồng ý để bình luận được hiển thị công khai trên trang. Bạn có thể sửa hoặc xóa bình luận của mình. Sau khi xóa tài khoản, bình luận vẫn ở lại dưới tên „Tài khoản đã xóa“; nếu muốn xóa cả chúng, hãy viết cho chúng tôi.
terms.s6.t=Nội dung trang web
terms.s6.p=Âm nhạc, lời bài hát, video, ảnh và logo thuộc về Skeli (hoặc đồng tác giả). Cứ thoải mái chia sẻ liên kết; sao chép và phát tán toàn bộ lời, ảnh hoặc bản ghi chỉ được phép khi có sự đồng ý của anh ấy.
terms.s7.t=Dịch vụ của công ty khác
terms.s7.p=Video, nhạc và liên kết dẫn tới YouTube, Spotify, Apple Music, Instagram và Facebook. Họ có điều khoản riêng; cách trang làm việc với họ được mô tả trong <a href="/privacy.jsp">Chính sách quyền riêng tư</a>.
terms.s8.t=Không bảo đảm
terms.s8.p=Chúng tôi làm trang với tình yêu, nhưng không bảo đảm trang luôn chạy không lỗi. Các tính năng có thể thay đổi, thêm hoặc bớt.
terms.s9.t=Thay đổi điều khoản
terms.s9.p=Khi quy tắc thay đổi, chúng tôi cập nhật ngày ở đầu trang. Những thay đổi lớn sẽ được thông báo trên trang.

