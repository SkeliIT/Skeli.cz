privacy.s2.chat=<b>Tin nhắn (không bắt buộc):</b> nội dung, thời gian, ai nhắn cho ai và tin đã đọc chưa. Chúng tôi lưu để các bạn đọc được. Nội dung được mã hóa trong cơ sở dữ liệu và không đọc được trong trang quản trị; quản trị viên chỉ thấy tin nhắn bị báo cáo. Đây không phải mã hóa giữa hai thiết bị: quản trị viên máy chủ có cả khóa về mặt kỹ thuật vẫn có thể truy cập. Tin nhắn tự xóa sau một năm. Bạn có thể xóa tin nhắn của mình hoặc cả cuộc trò chuyện bất cứ lúc nào; cuộc trò chuyện biến mất ở phía bạn, và khi người kia cũng xóa thì nó biến mất hoàn toàn. Khi xóa tài khoản, mọi cuộc trò chuyện của bạn sẽ biến mất. Bản sao của tin nhắn bị báo cáo được giữ đến khi quản trị viên xử lý, sau đó tối đa một năm. Liên kết từ YouTube, Spotify, Apple Music hoặc SoundCloud sẽ có thẻ trong tin nhắn. Trình phát chỉ tải sau khi bạn bấm, và chỉ khi đó dịch vụ mới thấy địa chỉ IP của bạn. Nếu tin nhắn giống lời rao bán ma túy, vũ khí hoặc ảnh khỏa thân, trình duyệt sẽ cảnh báo bạn trước khi gửi. Việc này chỉ diễn ra ở phía bạn, không gửi đi đâu và không ai biết.
