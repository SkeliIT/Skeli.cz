# --- GDPR, privacy, terms
privacy.heading=Chính sách quyền riêng tư
terms.heading=Điều khoản sử dụng
terms.updated=Có hiệu lực từ ngày 5/11/2026
terms.lead=Vài quy tắc đơn giản để skeli.cz là nơi dễ chịu cho tất cả mọi người.
terms.s1.t=Về trang web
terms.s1.p=Skeli.cz là trang web chính thức của rapper Skeli, do Radek Dvořák vận hành. Bạn có thể liên hệ với mình qua <a href="mailto:skelimc@seznam.cz">skelimc@seznam.cz</a>. Bạn có thể xem nhạc, video và lời bài hát mà không cần đăng ký. Một số tính năng, ví dụ bình luận, bình chọn, tin nhắn hay karaoke, cần có tài khoản.
terms.s2.t=Tài khoản của bạn
terms.s2.p=Mỗi người chỉ được có một tài khoản. Hãy đăng ký bằng e-mail mà bạn truy cập được và đừng chia sẻ mật khẩu với ai. Nếu nghi ngờ ai đó lạm dụng tài khoản của bạn, hãy đổi mật khẩu và viết cho mình. Nếu bạn chưa đủ 15 tuổi, bạn cần sự đồng ý của cha mẹ hoặc người giám hộ hợp pháp để đăng ký. Bạn có thể xóa tài khoản bất cứ lúc nào trong Cài đặt. Trong Âm nhạc của tôi, chỉ thêm những bài do bạn làm hoặc bạn có quyền cần thiết. Mình có thể ẩn bài vi phạm quyền của người khác. Quy tắc cư xử đàng hoàng cũng áp dụng cho tin nhắn riêng. Vi phạm nghiêm trọng hoặc lặp lại có thể khiến tài khoản bị chặn hoặc bị xóa.
terms.s3.t=Quy tắc cộng đồng
terms.s3.p=Bạn có thể phê bình âm nhạc và ý kiến của người khác, nhưng tấn công cá nhân thì không có chỗ ở đây. Trong bình luận, tin nhắn, trên hồ sơ, ảnh hồ sơ, ảnh bìa hồ sơ và trong Âm nhạc của tôi, những điều sau bị cấm:
terms.rule1=spam, quảng cáo không mong muốn và đăng lặp lại cùng một nội dung,
terms.rule2=xúc phạm, bắt nạt và quấy rối có chủ đích người khác,
terms.rule3=thù ghét con người vì nguồn gốc, quốc tịch, tôn giáo, giới tính, xu hướng tính dục, sức khỏe hoặc tương tự,
terms.rule4=đe dọa, kêu gọi bạo lực và cổ vũ bạo lực,
terms.rule5=công khai dữ liệu cá nhân của người khác khi không được phép, ví dụ địa chỉ, số điện thoại hoặc ảnh riêng tư,
terms.rule6=nội dung bất hợp pháp và liên kết tới trang lừa đảo hoặc độc hại,
terms.rule7=mạo danh người khác, ví dụ mạo danh Skeli,
terms.rule8=chào bán hoặc tìm mua ma túy, vũ khí và những thứ bất hợp pháp khác,
terms.rule9=khiêu dâm và nội dung tình dục. Nội dung thể hiện xâm hại tình dục trẻ em và các nghi ngờ khác về tội phạm nghiêm trọng liên quan tới trẻ em được xử lý trước tiên. Trong các trường hợp luật quy định, chúng mình thông báo cho cơ quan có thẩm quyền; trong các trường hợp khác chúng mình có thể báo nghi ngờ cho họ.
terms.s4.t=Báo cáo và kiểm duyệt
terms.s4.p=Bạn có thể báo cáo bình luận, hồ sơ hoặc tin nhắn vi phạm quy tắc bằng nút bên cạnh. Quản trị viên sẽ xem xét báo cáo và tùy tình huống mà giữ, sửa hoặc xóa nội dung. Bài trong Âm nhạc của tôi có thể bị ẩn. Khi vi phạm nghiêm trọng hoặc lặp lại, quản trị viên có thể chặn hoặc xóa tài khoản. Nội dung bất hợp pháp và nghi ngờ trẻ em gặp nguy hiểm được xử lý trước tiên; khi nào chúng mình thông báo cho cơ quan có thẩm quyền được mô tả ở điểm cuối cùng của Quy tắc cộng đồng phía trên. Quản trị viên thường không đọc tin nhắn riêng; trong trang quản trị chỉ thấy tin nhắn bị ai đó báo cáo. Cách tin nhắn được bảo vệ được mô tả trong <a href="/privacy.jsp">Chính sách quyền riêng tư</a>. Để báo cáo và để cơ quan chức năng liên hệ, hãy dùng <a href="mailto:skelimc@seznam.cz">skelimc@seznam.cz</a> (tiếng Séc hoặc tiếng Anh). Nếu không đồng ý với quyết định, hãy viết tới cùng địa chỉ và đề nghị xem xét lại.
terms.s5.t=Bình luận của bạn
terms.s5.p=Những gì bạn viết vẫn là của bạn. Khi gửi, bạn đồng ý để bình luận được hiển thị công khai trên trang web. Bạn có thể sửa hoặc xóa bình luận của mình. Nếu bạn xóa tài khoản, bình luận vẫn còn với nhãn “Tài khoản đã xóa” và không còn liên kết với hồ sơ của bạn. Nếu muốn xóa cả chúng, hãy viết tới <a href="mailto:skelimc@seznam.cz">skelimc@seznam.cz</a>.
terms.s6.t=Nội dung trang web
terms.s6.p=Âm nhạc, lời bài hát, video, ảnh và logo thuộc về Skeli hoặc các đồng tác giả và chủ sở hữu quyền khác. Bạn có thể chia sẻ liên kết tới âm nhạc thoải mái. Sao chép và phát tán toàn bộ lời bài hát, ảnh hoặc bản ghi chỉ được phép khi có sự đồng ý của chủ sở hữu quyền, trừ khi luật cho phép trực tiếp.
terms.s7.t=Dịch vụ của công ty khác
terms.s7.p=Trên trang web có nội dung và liên kết từ YouTube, Spotify, Apple Music, SoundCloud, Instagram và Facebook, và bạn cũng có thể đăng nhập bằng Google. Các dịch vụ này có điều khoản và chính sách riêng. Cách trang web làm việc với chúng được mô tả trong <a href="/privacy.jsp">Chính sách quyền riêng tư</a>.
terms.s8.t=Không bảo đảm
terms.s8.p=Mình cố gắng để trang web chạy tốt nhất có thể, nhưng vẫn có thể xảy ra lỗi hoặc gián đoạn. Các tính năng có thể thay đổi, được thêm hoặc biến mất theo thời gian. Điều này không ảnh hưởng tới các quyền mà luật pháp dành cho bạn.
terms.s9.t=Thay đổi điều khoản
terms.s9.p=Khi điều khoản thay đổi, chúng mình sẽ công bố bản mới và ngày áp dụng. Những thay đổi quan trọng sẽ được thông báo trên trang web.

