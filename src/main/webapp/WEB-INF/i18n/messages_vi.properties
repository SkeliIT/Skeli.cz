consent.spotify=Trình phát Spotify được tải từ máy chủ Spotify, nơi sẽ thấy địa chỉ IP của bạn. Trình phát tải sau khi bạn nhấp hoặc đồng ý trong thanh cookie.
privacy.updated=Có hiệu lực từ ngày 8/10/2026
privacy.lead=Rõ ràng và trung thực: skeli.cz xử lý dữ liệu nào, vì sao, trong bao lâu và bạn có thể làm gì với chúng.
privacy.s1.t=Ai chịu trách nhiệm
privacy.s1.p=Bên kiểm soát dữ liệu cá nhân là Radek Dvořák (Skeli), e-mail <a href="mailto:skelimc@seznam.cz">skelimc@seznam.cz</a>. Mọi yêu cầu về dữ liệu của bạn hãy gửi đến địa chỉ này.
privacy.s2.t=Chúng tôi xử lý gì và vì sao
privacy.s2.account=<b>Tài khoản:</b> tên người dùng, e-mail, mật khẩu (chỉ dưới dạng mã băm bcrypt – chúng tôi không bao giờ biết mật khẩu), ngày đăng ký và xác nhận e-mail. Dùng để vận hành tài khoản, bình luận và bình chọn (thực hiện hợp đồng – điều khoản sử dụng).
privacy.s2.profile=<b>Hồ sơ (không bắt buộc):</b> tên hiển thị, tuổi, thành phố, vài lời giới thiệu, ảnh đại diện, giao diện và ngôn ngữ. Bạn chỉ điền những gì muốn và có thể sửa hoặc xóa bất cứ lúc nào (đồng ý).
privacy.s2.comments=<b>Bình luận và bình chọn:</b> nội dung bình luận, ngày và các lượt bình chọn cho bài hát và bình luận. Bình luận là công khai. Chỉ quản trị viên thấy các báo cáo bình luận.
privacy.s2.newsletter=<b>Tin mới qua e-mail:</b> e-mail của bạn và ngày đăng ký, xác nhận. Việc đăng ký chỉ bắt đầu sau khi bạn nhấp vào liên kết trong e-mail xác nhận, và mỗi e-mail đều có liên kết hủy đăng ký (đồng ý).
privacy.s2.security=<b>Bảo mật:</b> địa chỉ IP được giữ ngắn hạn trong bộ nhớ máy chủ để chống spam và đoán mật khẩu, và xuất hiện trong nhật ký kỹ thuật của máy chủ. Khi bạn đặt mật khẩu, chúng tôi kiểm tra xem nó có xuất hiện trong các vụ rò rỉ dữ liệu không (Have I Been Pwned): chỉ 5 ký tự đầu của mã băm rời khỏi máy chủ, không bao giờ là mật khẩu hay thông tin của bạn (lợi ích hợp pháp – bảo mật).
privacy.s2.stats=<b>Đếm lượt truy cập (không dùng cookie):</b> khi một trang được hiển thị, web tạo từ địa chỉ IP và loại trình duyệt (khi đăng nhập là số tài khoản) một dấu vân tay ẩn danh. Khóa của nó bị xóa mỗi ngày lúc nửa đêm và tạo khóa mới, nên không thể nhận ra bạn hay nối các lượt truy cập của những ngày khác nhau. Nó chỉ dùng cho con số: bao nhiêu người đang trên web, bao nhiêu người đến trong ngày và lời bài hát được đọc bao nhiêu lần (mỗi lời bài hát chỉ tính tối đa một lần mỗi ngày cho bạn). Chúng tôi không lưu địa chỉ IP hay trình duyệt (lợi ích chính đáng – nắm được lượng truy cập).
privacy.s3.t=Cookie và bộ nhớ trình duyệt
privacy.s3.session=<b>Cookie đăng nhập cần thiết</b> (JSESSIONID): không có nó thì không đăng nhập được. Có hiệu lực đến khi đóng trình duyệt, 30 ngày nếu chọn “Ghi nhớ trên thiết bị này”.
privacy.s3.storage=<b>Cài đặt trong trình duyệt</b> (localStorage): lựa chọn của bạn ở thanh cookie, giao diện sáng/tối, cỡ chữ lời bài hát, trạng thái trình phát Spotify và cài đặt của MC Kevin. Chúng chỉ ở trong trình duyệt của bạn và không gửi lên máy chủ.
privacy.s3.matomo=<b>Thống kê truy cập</b> bằng Matomo trên máy chủ của người vận hành trang (không phải Google) – chỉ tải khi bạn cho phép trong thanh cookie („Chấp nhận tất cả“ hoặc „Tùy chỉnh“ → Thống kê truy cập). Trước đó không có gì được gửi đến máy chủ thống kê. Bạn có thể thay đổi hoặc rút lại sự đồng ý bất cứ lúc nào qua „Cài đặt cookie“ ở chân trang.
privacy.s4.t=Nội dung từ dịch vụ khác
privacy.s4.p=Video YouTube và trình phát Spotify chỉ tải sau khi bạn đồng ý ở thanh cookie hoặc nhấp “Tải trình phát”. Khi đó YouTube (Google) hoặc Spotify thấy địa chỉ IP của bạn và tuân theo chính sách của họ. Ảnh xem trước, phông chữ và biểu tượng được gửi từ máy chủ của chúng tôi. Liên kết tới Instagram, Facebook, YouTube, Spotify và Apple Music dẫn tới trang của họ.
privacy.s5.t=Dữ liệu được chuyển cho ai
privacy.s5.p=Chúng tôi không bao giờ bán dữ liệu. Về mặt kỹ thuật, dữ liệu được xử lý bởi đơn vị vận hành máy chủ và thư điện tử nơi trang chạy (hosting tại Séc); e-mail (xác nhận tài khoản, đặt lại mật khẩu, tin mới) được gửi qua máy chủ thư.
privacy.s6.t=Trong bao lâu
privacy.s6.p=Tài khoản và hồ sơ cho đến khi bạn xóa tài khoản. Đăng ký tin mới cho đến khi bạn hủy. Liên kết đặt lại mật khẩu có hiệu lực 30 phút, xác nhận e-mail 48 giờ. Bản sao lưu cơ sở dữ liệu chỉ dùng để khôi phục sau sự cố.
privacy.s7.t=Xóa tài khoản
privacy.s7.p=Trong Cài đặt → Xóa tài khoản. Tên, e-mail, mật khẩu, ảnh đại diện, hồ sơ, báo cáo và đăng ký tin mới sẽ bị xóa và bạn được đăng xuất trên mọi thiết bị. Bình luận vẫn còn với nhãn “Tài khoản đã xóa” và lượt bình chọn vẫn được tính, nhưng không còn gắn với bạn. Muốn xóa cả bình luận? Hãy viết tới <a href="mailto:skelimc@seznam.cz">skelimc@seznam.cz</a>.
privacy.s8.t=Quyền của bạn
privacy.s8.p=Bạn có quyền truy cập dữ liệu (Cài đặt → Xuất dữ liệu (JSON)), chỉnh sửa (Cài đặt), xóa, hạn chế xử lý, chuyển dữ liệu (tệp tải về ở dạng JSON), phản đối và rút lại sự đồng ý. Bạn có thể khiếu nại tới Văn phòng Bảo vệ Dữ liệu Cá nhân Séc (<a href="https://uoou.gov.cz" target="_blank" rel="noopener">uoou.gov.cz</a>).
privacy.s9.t=Độ tuổi
privacy.s9.p=Nếu bạn dưới 15 tuổi, hãy xin phép cha mẹ trước khi đăng ký.
