email.newsletter.confirm.body=Xin chào,\n\nđịa chỉ này đã được dùng để đăng ký nhận tin từ Skeli.cz. Hãy xác nhận bằng cách nhấp vào liên kết (có hiệu lực trong 48 giờ):\n{link}\n\nNếu không phải bạn, hãy bỏ qua email này – nếu không xác nhận, chúng tôi sẽ không gửi thêm gì cho bạn.\n\nSkeli

