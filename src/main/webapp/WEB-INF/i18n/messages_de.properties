email.register.body=Willkommen bei Skeli.cz!\n\nDein Konto „{username}“ wurde erfolgreich erstellt.\n\nDu kannst dich jetzt auf unserer Website anmelden:\n{link}\n\nDanke für deine Registrierung – wir freuen uns auf dich in unserer Community!\n\nViele Grüße\nDas Skeli.cz-Team
email.reset.subject=Skeli.cz – Passwort zurücksetzen
