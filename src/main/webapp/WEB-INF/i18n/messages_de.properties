# --- DSGVO, Datenschutz, Nutzungsbedingungen
privacy.heading=Datenschutzerklärung
terms.heading=Nutzungsbedingungen
terms.updated=Gültig ab 5. November 2026
terms.lead=Ein paar einfache Regeln, damit skeli.cz für alle ein guter Ort ist.
terms.s1.t=Über die Website
terms.s1.p=Skeli.cz ist die offizielle Website des Rappers Skeli, betrieben von Radek Dvořák. Du erreichst mich unter <a href="mailto:skelimc@seznam.cz">skelimc@seznam.cz</a>. Musik, Videos und Texte kannst du ohne Registrierung ansehen. Manche Funktionen, zum Beispiel Kommentare, Abstimmungen, Nachrichten oder Karaoke, brauchen ein Konto.
terms.s2.t=Dein Konto
terms.s2.p=Jede Person darf nur ein Konto haben. Melde dich mit einer E-Mail-Adresse an, auf die du Zugriff hast, und gib dein Passwort niemandem. Wenn du vermutest, dass jemand dein Konto missbraucht hat, ändere dein Passwort und schreib mir. Wenn du jünger als 15 bist, brauchst du für die Registrierung die Zustimmung eines Elternteils oder Erziehungsberechtigten. Du kannst dein Konto jederzeit in den Einstellungen löschen. Füge unter „Meine Musik“ nur Tracks hinzu, die du selbst gemacht hast oder an denen du die nötigen Rechte hast. Einen Track, der die Rechte anderer verletzt, kann ich ausblenden. Die Regeln für anständiges Verhalten gelten auch für private Nachrichten. Bei schweren oder wiederholten Verstößen kann ein Konto gesperrt oder gelöscht werden.
terms.s3.t=Community-Regeln
terms.s3.p=Du darfst die Musik und die Meinungen anderer kritisieren, persönliche Angriffe gehören aber nicht hierher. In Kommentaren, Nachrichten, im Profil, im Profilfoto, im Profilbanner und unter „Meine Musik“ ist verboten:
terms.rule1=Spam, unerwünschte Werbung und das wiederholte Veröffentlichen desselben Inhalts,
terms.rule2=Beleidigungen, Mobbing und gezielte Belästigung anderer,
terms.rule3=Hass gegen Menschen wegen Herkunft, Nationalität, Religion, Geschlecht, sexueller Orientierung, Gesundheit oder Ähnlichem,
terms.rule4=Drohungen, Aufrufe zu Gewalt und deren Verherrlichung,
terms.rule5=das Veröffentlichen fremder persönlicher Daten ohne Erlaubnis, zum Beispiel Adresse, Telefonnummer oder private Fotos,
terms.rule6=illegale Inhalte und Links zu betrügerischen oder schädlichen Seiten,
terms.rule7=sich als jemand anderes ausgeben, zum Beispiel als Skeli,
terms.rule8=das Anbieten oder Suchen von Drogen, Waffen und anderen illegalen Dingen,
terms.rule9=Pornografie und sexuelle Inhalte. Inhalte, die sexuellen Missbrauch von Kindern zeigen, und andere Verdachtsfälle schwerer Straftaten im Zusammenhang mit Kindern behandeln wir vorrangig. In den gesetzlich festgelegten Fällen informieren wir die zuständigen Behörden, in anderen Fällen können wir ihnen den Verdacht melden.
terms.s4.t=Meldungen und Moderation
terms.s4.p=Einen Kommentar, ein Profil oder eine Nachricht, die gegen die Regeln verstoßen, kannst du mit dem Button daneben melden. Der Administrator prüft die Meldung und lässt den Inhalt je nach Lage stehen, bearbeitet oder löscht ihn. Einen Track unter „Meine Musik“ kann er ausblenden. Bei schweren oder wiederholten Verstößen kann er das Konto sperren oder löschen. Illegale Inhalte und der Verdacht auf Gefährdung eines Kindes werden vorrangig behandelt; wann wir die zuständigen Behörden informieren, beschreibt der letzte Punkt der Community-Regeln oben. Private Nachrichten liest der Administrator normalerweise nicht, in der Verwaltung sieht er nur eine Nachricht, die ihm jemand gemeldet hat. Wie Nachrichten geschützt sind, steht in der <a href="/privacy.jsp">Datenschutzerklärung</a>. Für Meldungen und für Kontakt von Behörden gilt <a href="mailto:skelimc@seznam.cz">skelimc@seznam.cz</a> (Tschechisch oder Englisch). Wenn du mit einer Entscheidung nicht einverstanden bist, schreib an dieselbe Adresse und bitte um eine erneute Prüfung.
terms.s5.t=Deine Kommentare
terms.s5.p=Was du schreibst, bleibt deins. Mit dem Absenden bist du einverstanden, dass der Kommentar auf der Website öffentlich angezeigt wird. Deinen Kommentar kannst du bearbeiten oder löschen. Wenn du dein Konto löschst, bleiben deine Kommentare mit dem Vermerk „Gelöschtes Konto“ und ohne Verbindung zu deinem Profil. Wenn du auch sie löschen lassen willst, schreib an <a href="mailto:skelimc@seznam.cz">skelimc@seznam.cz</a>.
terms.s6.t=Inhalte der Website
terms.s6.p=Musik, Songtexte, Videos, Fotos und Logo gehören Skeli bzw. Mitautoren und anderen Rechteinhabern. Links zur Musik darfst du teilen, wie du willst. Ganze Texte, Fotos oder Aufnahmen zu kopieren und weiterzuverbreiten ist nur mit Erlaubnis des Rechteinhabers erlaubt, sofern das Gesetz es nicht direkt zulässt.
terms.s7.t=Dienste anderer Firmen
terms.s7.p=Auf der Website findest du Inhalte und Links von YouTube, Spotify, Apple Music, SoundCloud, Instagram und Facebook, und du kannst dich auch mit Google anmelden. Diese Dienste haben eigene Bedingungen und Richtlinien. Wie die Website mit ihnen arbeitet, steht in der <a href="/privacy.jsp">Datenschutzerklärung</a>.
terms.s8.t=Ohne Gewähr
terms.s8.p=Ich gebe mir Mühe, dass die Website gut läuft, trotzdem kann es Fehler oder Ausfälle geben. Funktionen können sich mit der Zeit ändern, dazukommen oder wegfallen. Deine gesetzlichen Rechte bleiben davon unberührt.
terms.s9.t=Änderungen der Bedingungen
terms.s9.p=Wenn sich die Bedingungen ändern, veröffentlichen wir die neue Fassung und das Datum, ab dem sie gilt. Über wichtige Änderungen informieren wir auf der Website.

