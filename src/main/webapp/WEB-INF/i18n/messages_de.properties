# --- DSGVO, Datenschutz, Nutzungsbedingungen
privacy.heading=Datenschutzerklärung
terms.heading=Nutzungsbedingungen
terms.updated=Gültig ab 8. Oktober 2026
terms.lead=Ein paar klare Regeln, damit sich hier alle wohlfühlen – Fans, Kritiker und Skeli.
terms.s1.t=Über die Website
terms.s1.p=skeli.cz ist die offizielle Website von Skeli, betrieben von Radek Dvořák (Skeli), Kontakt <a href="mailto:skelimc@seznam.cz">skelimc@seznam.cz</a>. Texte lesen, Musik hören und Videos schauen geht ohne Konto; ein Konto brauchst du nur zum Kommentieren und Abstimmen.
terms.s2.t=Dein Konto
terms.s2.p=Ein Mensch = ein Konto. Gib eine E-Mail an, auf die du Zugriff hast, und gib dein Passwort niemandem – für alles, was von deinem Konto geschrieben wird, bist du verantwortlich. Unter 15 brauchst du die Zustimmung eines Elternteils. Dein Konto kannst du jederzeit in den Einstellungen löschen.
terms.s3.t=Community-Regeln
terms.s3.p=Kritik an der Musik ist okay, Hass gegen Menschen nicht. In Kommentaren ist verboten:
terms.rule1=Spam, Werbung und immer wieder derselbe Text,
terms.rule2=Beleidigungen, Mobbing und Angriffe auf andere,
terms.rule3=Hass wegen Herkunft, Nationalität, Religion, Geschlecht, Sexualität, Gesundheit oder Ähnlichem,
terms.rule4=Drohungen und Aufrufe zu Gewalt,
terms.rule5=persönliche Daten anderer (Adresse, Telefon, Fotos…) – sogenanntes Doxxing,
terms.rule6=illegale Inhalte und Links zu betrügerischen oder schädlichen Seiten,
terms.rule7=sich als jemand anderes ausgeben (zum Beispiel als Skeli).
terms.s4.t=Meldungen und Moderation
terms.s4.p=Einen Kommentar, der gegen die Regeln verstößt, meldest du mit dem Button daneben. Meldungen sieht nur der Administrator und entscheidet: Der Kommentar bleibt, wird bearbeitet oder gelöscht. Bei schweren oder wiederholten Verstößen kann auch das Konto gelöscht werden. Nicht einverstanden? Schreib an <a href="mailto:skelimc@seznam.cz">skelimc@seznam.cz</a>, dann schauen wir es uns noch einmal an.
terms.s5.t=Deine Kommentare
terms.s5.p=Was du schreibst, bleibt deins. Mit dem Absenden stimmst du zu, dass der Kommentar öffentlich auf der Seite angezeigt wird. Eigene Kommentare kannst du bearbeiten oder löschen. Nach dem Löschen des Kontos bleiben Kommentare unter „Gelöschtes Konto“; wenn du sie auch löschen willst, schreib uns.
terms.s6.t=Inhalte der Website
terms.s6.p=Musik, Songtexte, Videos, Fotos und Logo gehören Skeli (bzw. Mitautoren). Links darfst du teilen, wie du willst; ganze Texte, Fotos oder Aufnahmen kopieren und verbreiten nur mit seiner Zustimmung.
terms.s7.t=Dienste anderer Firmen
terms.s7.p=Videos, Musik und Links führen zu YouTube, Spotify, Apple Music, Instagram und Facebook. Diese haben eigene Bedingungen; wie die Website mit ihnen umgeht, steht in der <a href="/privacy.jsp">Datenschutzerklärung</a>.
terms.s8.t=Ohne Gewähr
terms.s8.p=Wir machen die Website mit Liebe, aber ohne Garantie, dass sie immer und fehlerfrei läuft. Funktionen können sich ändern, dazukommen oder wegfallen.
terms.s9.t=Änderungen der Bedingungen
terms.s9.p=Wenn sich die Regeln ändern, passen wir das Datum oben auf der Seite an. Größere Änderungen kündigen wir auf der Website an.

