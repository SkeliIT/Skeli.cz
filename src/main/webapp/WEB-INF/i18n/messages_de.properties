email.verify.body=Hallo {username},\n\ndanke für deine Registrierung auf Skeli.cz! Bitte bestätige deine E-Mail mit einem Klick auf den Link (48 Stunden gültig):\n{link}\n\nFalls du dich nicht registriert hast, ignoriere diese E-Mail.\n\nSkeli
about.intro1=Ich heiße Radek Dvořák, Jahrgang 1992. 🦖 Musikalisch trete ich als <strong>Skeli</strong> auf und mache Musik, seit ich fünfzehn bin.
about.selftaught.text=Ich bin Autodidakt. Alles habe ich mir nach und nach selbst beigebracht – vom Schreiben der Texte über Aufnahmen und die Arbeit mit dem Sound bis zu Musikvideos. Ich experimentiere gern, suche meinen eigenen Sound und probiere Neues aus. In eine Schublade will ich mich nicht stecken lassen. Jeder Song hat seine Geschichte und einen Grund, warum er entstanden ist.
about.web.text=Denselben Weg bin ich auch abseits der Musik gegangen. <strong>Skeli.cz habe ich selbst gebaut</strong>, weil ich einen eigenen Ort wollte, an dem ich meine Musik so zeigen kann, wie ich sie mir vorstelle. Von den ersten Ideen bis zum Betrieb der Seite ist das ein weiterer Teil meines Projekts, den ich mit meinen eigenen Händen aufbaue.
about.squad.title=Skelo Squad 🖤
about.squad.p1=Mein Traum ist ein eigenes Musiklabel mit dem Namen <strong>Skelo Squad</strong>. Ein Ort, an dem neue Projekte entstehen, Künstler zusammenarbeiten und gemeinsam etwas Größeres schaffen.
about.squad.p2=Noch stehen wir am Anfang. Ich baue es zusammen mit meiner Freundin Andy auf, die mir mit Social Media, Musikvideos und vielem anderen rund um meine Musik hilft, und mit Kater {kevin}Kevin{/kevin}, der hier auf der Website zum Maskottchen und Helfer geworden ist. 🐈
about.kevin.alt=Kater Kevin
about.squad.p3=Ich lerne immer noch, suche neue Möglichkeiten und entwickle mich weiter. Ich will nicht bei Ideen stehen bleiben. Ich will sie Schritt für Schritt wahr machen.
about.outro=<strong>Ich bin Skeli. Das ist meine Musik, meine Vision und eine Welt, die ich mir auf meine Art aufbaue.</strong> 🤘
about.signature=Skelo Squad.
about.music.title=Musikalischer Werdegang
about.music.text=Von den ersten Tracks bis zur aktuellen Produktion. Videos und Playlists findest du auf der Seite Musik.
about.collab.title=Zusammenarbeit
about.collab.text=Wenn dir meine Sachen gefallen, schreib mir. Ich freue mich über Rap-Features, Beatproduktion und Visuals.
