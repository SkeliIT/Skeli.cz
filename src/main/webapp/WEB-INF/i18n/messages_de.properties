privacy.s2.chat=<b>Nachrichten (freiwillig):</b> Text, Zeit, wer wem geschrieben hat und ob die Nachricht gelesen wurde. Wir speichern sie, damit ihr sie lesen könnt. Der Text ist in der Datenbank verschlüsselt und im Admin-Bereich nicht lesbar; der Administrator sieht nur eine Nachricht, die jemand meldet. Das ist keine Verschlüsselung von Gerät zu Gerät: Ein Serveradministrator, der auch den Schlüssel hat, käme technisch daran. Nachrichten löschen sich nach einem Jahr von selbst. Du kannst deine Nachricht oder eine ganze Unterhaltung jederzeit löschen; die Unterhaltung verschwindet bei dir, und wenn die andere Person sie auch löscht, ist sie endgültig weg. Mit dem Löschen deines Kontos verschwinden alle deine Unterhaltungen. Eine Kopie einer gemeldeten Nachricht bleibt, bis der Administrator es erledigt, danach höchstens ein Jahr. Ein Link von YouTube, Spotify, Apple Music oder SoundCloud bekommt in der Nachricht eine Karte. Der Player lädt erst nach dem Klick, und erst dann sieht der Dienst deine IP-Adresse. Sieht eine Nachricht nach einem Angebot von Drogen, Waffen oder Nacktfotos aus, warnt dich dein Browser vor dem Senden. Das passiert nur bei dir, nichts wird irgendwohin geschickt und niemand erfährt es.
