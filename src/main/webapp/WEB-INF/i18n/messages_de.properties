email.verify.subject=Bestätige dein Konto auf Skeli.cz
email.verify.body=Hallo {username},\n\ndanke für deine Registrierung auf Skeli.cz! Bitte bestätige deine E-Mail mit einem Klick auf den Link (48 Stunden gültig):\n{link}\n\nFalls du dich nicht registriert hast, ignoriere diese E-Mail.\n\nSkeli
about.intro1=Ich heiße Radek Dvořák, Jahrgang 1992. 🦖
about.intro2=Als Musiker trete ich unter dem Namen Skeli auf und mache Musik, seit ich fünfzehn bin.
about.selftaught.text=Ich bin ein tschechischer Rapper/Sänger und vor allem Autodidakt. Ich habe keine Musikschule besucht und keine formale musikalische Ausbildung. Alles habe ich mir nach und nach selbst beigebracht – vom Schreiben der Texte über die Aufnahmen bis hin zur Arbeit am Sound und zum Drehen von Videos. Und ich lerne immer weiter, weil ich finde, dass man in der Musik nie an den Punkt kommt, an dem man schon alles weiß.
about.work.text=Neben der Musik habe ich ursprünglich als Installateur gearbeitet. Ich habe auch ein paar Fabriken ausprobiert, die mir ziemlich schnell eine wichtige Sache gezeigt haben:
about.work.quote=Fabrik? Echt nicht.
about.why.p1=Musik ist für mich vor allem ein Weg, Dinge festzuhalten, die man erlebt, über die man nachdenkt oder die man einfach nicht nur so durch den Kopf gehen lassen will. Manchmal ist es eine Geschichte, manchmal eine Stimmung, manchmal eine ganz normale Lebenssituation und manchmal etwas, das mich richtig wütend macht. Jeder Track kann also aus einem ganz anderen Grund entstehen.
about.why.p2=Ich muss mich nicht an ein Thema oder einen Stil halten. Ich probiere gern Neues aus und entwickle mich weiter – ob beim Schreiben, bei den Aufnahmen, beim Sound, beim Musikvideo oder bei der ganzen Präsentation der Musik.
about.squad.p1=Ein großer Teil meines Weges ist auch Skelo Squad.
about.squad.p2=Skelo Squad ist nicht nur ein Name, den ich unter meine Beiträge setze. Es ist mein Traum, mit der Zeit ein eigenes Musiklabel aufzubauen, bei dem auch andere Künstler veröffentlichen und wir gemeinsam etwas Größeres schaffen könnten.
about.squad.p3=Noch ist Skelo Squad ein kleines Team: ich und meine Freundin, mit der ich schon über zehn Jahre zusammen bin. Sie hilft mir mit den sozialen Netzwerken und den Musikvideos und steckt hinter vielen Dingen, die man auf den ersten Blick nicht sieht.
about.squad.p4=Vielleicht sind wir also noch kein großes Label.
about.squad.p5=Aber jeder fängt irgendwo an.
about.squad.p6=Und genau deshalb möchte ich Skelo Squad Schritt für Schritt weiter aufbauen – als Ort für meine eigene Musik, für Zusammenarbeit und eines Tages vielleicht auch für andere Künstler, die dabei sein wollen.
about.outro=Ich bin Skeli. Das ist meine Musik, mein Weg und der Anfang von Skelo Squad. 🖤
about.signature=Skelo Squad.
about.music.title=Musikalischer Werdegang
about.music.text=Von den ersten Tracks bis zur aktuellen Produktion. Clips und Playlists findest du auf der Seite Musik.
about.collab.title=Zusammenarbeit
about.collab.text=Wenn dir meine Sachen gefallen, schreib mir. Ich freue mich über Rap-Features, Beatproduktion und Visuals.
