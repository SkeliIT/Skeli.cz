privacy.updated=Gültig ab 5. November 2026
privacy.lead=Verständlich und ehrlich: welche Daten skeli.cz verarbeitet, warum, wie lange und was du damit tun kannst.
privacy.s1.t=Wer verantwortlich ist
privacy.s1.p=Verantwortlicher ist Radek Dvořák (Skeli), E-Mail <a href="mailto:skelimc@seznam.cz">skelimc@seznam.cz</a>. Schicke alle Anfragen zu deinen Daten an diese Adresse.
privacy.s2.t=Was wir verarbeiten und warum
privacy.s2.account=<b>Konto:</b> Benutzername, E-Mail, Passwort (nur als verschlüsselter bcrypt-Hash – das Passwort selbst kennen wir nie), Registrierungsdatum und E-Mail-Bestätigung. Für den Betrieb des Kontos, Kommentare und Abstimmungen (Vertragserfüllung – Nutzungsbedingungen).
privacy.s2.profile=<b>Profil (freiwillig):</b> Anzeigename, Alter, Stadt, ein paar Worte über dich, Profilfoto, Titelbild, Design und Sprache. Du füllst nur aus, was du willst, und kannst es jederzeit ändern oder löschen (Einwilligung). Deine Anfragen und blockierten Personen siehst nur du. Andere angemeldete Personen sehen deine Stadt, die Worte über dich, deine Songs mit Herz, deine Freunde und deinen Online-Status nur, wenn du das einschaltest. Wenn du deine Musik hinzufügst, speichern wir Titel, Jahr und Links zu den Tracks; andere angemeldete Personen sehen sie, bis du das ausschaltest. Wenn du dein Profil für alle einschaltest, kann jeder mit dem Link Name, Foto, Vorstellung und Tracks sehen. Suchmaschinen halten wir davon fern.
privacy.s2.comments=<b>Kommentare und Stimmen:</b> Kommentartext, Datum und Stimmen zu Songs und Kommentaren. Kommentare sind öffentlich. Meldungen von Kommentaren sieht nur der Administrator.
privacy.s2.newsletter=<b>Neuigkeiten per E-Mail:</b> deine E-Mail und das Datum der Anmeldung und Bestätigung. Das Abo beginnt erst nach dem Klick auf den Link in der Bestätigungs-E-Mail, jede E-Mail enthält einen Abmeldelink (Einwilligung).
privacy.s2.security=<b>Sicherheit:</b> deine IP-Adresse wird kurz im Speicher des Servers gehalten, um Spam und das Erraten von Passwörtern zu verhindern, und erscheint in technischen Protokollen. Beim Festlegen eines Passworts prüfen wir, ob es in Datenlecks aufgetaucht ist (Have I Been Pwned): nur die ersten 5 Zeichen des Passwort-Hashes verlassen den Server, nie das Passwort oder deine Daten (berechtigtes Interesse – Sicherheit).
privacy.s2.stats=<b>Besucherzählung (ohne Cookies):</b> Wenn eine Seite angezeigt wird, bildet die Website aus deiner IP-Adresse und dem Browsertyp (angemeldet aus deiner Kontonummer) einen anonymen Fingerabdruck. Sein Schlüssel wird jeden Tag um Mitternacht verworfen und neu erzeugt, sodass man dich daran weder erkennen noch Besuche verschiedener Tage verbinden kann. Er dient nur für Zahlen: wie viele Leute gerade auf der Seite sind, wie viele an einem Tag kamen und wie oft ein Songtext gelesen wurde (jeder Text zählt für dich höchstens einmal am Tag). IP-Adresse und Browser speichern wir nicht (berechtigtes Interesse – Überblick über die Besucherzahlen).
privacy.s2.plays=<b>Was am meisten läuft (ohne Cookies):</b> Mit demselben täglichen Fingerabdruck wie bei den Besuchen zählt die Website, wie oft ein Songtext geöffnet, ein Video gestartet und das Karaoke-Kino betreten wurde – jedes davon zählt bei dir höchstens einmal am Tag. Meldest du dich während eines Besuchs an, zählst du an dem Tag nur einmal. Das dient nur den Ranglisten in der Administration (berechtigtes Interesse – zu wissen, was den Leuten gefällt).
privacy.s2.reports=<b>Ein Problem an Kevin melden (freiwillig):</b> der Text, den du schreibst, und die Adresse der Seite, auf der du warst; bei angemeldeten Besuchern auch dein Konto. Deine IP-Adresse speichern wir nicht. Nur der Administrator sieht es und löscht die Meldung, sobald das Problem behoben ist (berechtigtes Interesse – Fehler der Website beheben).
privacy.s2.help=<b>Ergänzen eines fehlenden Songtextes (freiwillig):</b> der Text, den du schreibst; bei angemeldeten Besuchern auch dein Konto. Deine IP-Adresse speichern wir nicht. Nur der Administrator sieht es und löscht es nach der Bearbeitung (berechtigtes Interesse – vollständige Songtexte).
privacy.s2.marketing=<b>Woher Besucher kommen (Statistik):</b> zu Beginn eines Besuchs zählen wir nur den Namen der Website, von der du kommst (z. B. instagram.com – nichts weiter von der Adresse), ein Kampagnen-Kennzeichen aus dem Link (z. B. ?z=ig-bio), die Geräteart (Handy / Tablet / Computer), die Sprache der Website und die Stunde. Ebenso zählen wir nur Klicks auf Links zu Spotify, Apple Music, YouTube und sozialen Netzwerken sowie Suchbegriffe unter Texte (nach 90 Tagen gelöscht). Gespeichert werden nur Tagessummen – keine Cookies, keine IP-Adresse, nichts davon lässt sich mit dir verbinden (berechtigtes Interesse – wissen, woher Fans kommen und was sie interessiert).
privacy.s2.trash=<b>Papierkorb in der Verwaltung:</b> löscht der Administrator einen Kommentar (oder einen Song bzw. ein Video samt Kommentaren), bleibt eine Kopie 30 Tage im Papierkorb, damit sich ein Versehen rückgängig machen lässt; danach wird sie endgültig gelöscht. Einen Kommentar, den du selbst löschst, bewahren wir nicht auf (berechtigtes Interesse – Schutz vor Versehen).
privacy.s3.t=Cookies und Browser-Speicher
privacy.s3.session=<b>Notwendiges Anmelde-Cookie</b> (JSESSIONID): ohne es funktioniert die Anmeldung nicht. Es gilt bis zum Schließen des Browsers, mit „Auf diesem Gerät merken“ 30 Tage.
privacy.s3.storage=<b>Einstellungen im Browser</b> (localStorage): deine Wahl in der Cookie-Leiste, helles/dunkles Design, Textgröße, Zustand des Spotify-Players und Kevins Einstellungen. Sie bleiben in deinem Browser und werden nie an den Server gesendet.
privacy.s4.t=Inhalte anderer Dienste
privacy.s4.p=YouTube-Videos und der Spotify-Player laden erst nach deiner Zustimmung in der Cookie-Leiste oder einem Klick auf „Player laden“. Dann sehen YouTube (Google) oder Spotify deine IP-Adresse und folgen ihren eigenen Richtlinien. Vorschaubilder, Schriften und Icons kommen von unserem eigenen Server. Links zu Instagram, Facebook, YouTube, Spotify und Apple Music führen auf deren Websites.
privacy.s5.t=Wer die Daten bekommt
privacy.s5.p=Wir verkaufen sie nie. Technisch verarbeitet sie der Betreiber des Servers und der E-Mail, auf dem die Website läuft (Hosting in Tschechien); E-Mails (Kontobestätigung, Passwort-Reset, Neuigkeiten) gehen über den Mailserver.
privacy.s6.t=Wie lange
privacy.s6.p=Konto und Profil bis zur Löschung des Kontos. Das Abo der Neuigkeiten bis zur Abmeldung. Ein Link zum Zurücksetzen des Passworts gilt 30 Minuten, eine E-Mail-Bestätigung 48 Stunden. Datenbank-Backups dienen nur zur Wiederherstellung nach einem Ausfall.
privacy.s6.more=Problemmeldungen bis zu ihrer Erledigung. Deine Bewertung der Website bis zur Löschung deines Kontos.
privacy.s7.t=Konto löschen
privacy.s7.p=In Einstellungen → Konto löschen. Name, E-Mail, Passwort, Google-Anmeldung, Zwei-Faktor-Anmeldung, Profilfoto, Titelbild, Profil, Nachrichten, Spielergebnisse, Bewertung der Website und das Abo werden gelöscht, und du wirst auf allen Geräten abgemeldet. Kommentare bleiben als „Gelöschtes Konto“, Stimmen bleiben gezählt, ohne Bezug zu dir. Meldungen, die du geschickt hast, werden gelöscht, sobald der Administrator sie bearbeitet hat. Meldungen über dein Konto oder deine Nachrichten bleiben als Beweis, bis sie bearbeitet sind, und danach höchstens ein Jahr (berechtigtes Interesse – Schutz der anderen Nutzer). Sollen auch die Kommentare weg? Schreib an <a href="mailto:skelimc@seznam.cz">skelimc@seznam.cz</a>.
privacy.s8.t=Deine Rechte
privacy.s8.p=Du hast das Recht auf Auskunft (Einstellungen → Daten exportieren (JSON)), Berichtigung (Einstellungen), Löschung, Einschränkung, Datenübertragbarkeit (der Download ist JSON), Widerspruch und Widerruf der Einwilligung. Beschwerden nimmt die tschechische Datenschutzbehörde entgegen (<a href="https://uoou.gov.cz" target="_blank" rel="noopener">uoou.gov.cz</a>).
privacy.s9.t=Alter
privacy.s9.p=Wenn du jünger als 15 bist, bitte deine Eltern um Zustimmung zur Registrierung.
