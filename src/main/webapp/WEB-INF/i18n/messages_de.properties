privacy.updated=Gültig ab 5. November 2026
privacy.lead=Hier erfährst du, welche personenbezogenen Daten skeli.cz verarbeitet, warum, wie lange sie gespeichert werden und welche Rechte du hast.
privacy.s1.t=Wer verantwortlich ist
privacy.s1.p=Verantwortlicher für die personenbezogenen Daten ist Radek Dvořák (Skeli). Bei Fragen zum Datenschutz schreib mir an <a href="mailto:skelimc@seznam.cz">skelimc@seznam.cz</a>. An dieselbe Adresse kannst du auch Anfragen auf Auskunft, Berichtigung oder Löschung deiner Daten schicken.
privacy.s2.t=Was wir verarbeiten und warum
privacy.s2.account=<b>Konto:</b> Benutzername, E-Mail, Passwort (nur als bcrypt-Hash, das Passwort selbst kennen wir nicht), Registrierungsdatum und E-Mail-Bestätigung. Dient dem Betrieb deines Kontos und der Funktionen für angemeldete Nutzer, zum Beispiel Kommentare und Abstimmungen (Vertragserfüllung, also die Nutzungsbedingungen).
privacy.s2.profile=<b>Profil (freiwillig):</b> Anzeigename, Alter, Stadt, ein paar Worte über dich, Profilfoto, Profilbanner, Aussehen und Sprache der Website. Du füllst nur aus, was du willst, und kannst es jederzeit ändern oder löschen (Einwilligung). Freundschaftsanfragen und blockierte Personen siehst nur du. Ob andere angemeldete Nutzer deine Stadt, ein paar Worte über dich, Songs mit Herz, Freunde, Online-Status oder letzte Aktivität sehen, entscheidest du unter Einstellungen → Privatsphäre. Wenn du deine Musik hinzufügst, speichern wir Titel, Jahr und Links zu den Tracks; andere angemeldete Nutzer sehen sie, bis du das ausschaltest. Wenn du dein Profil auch für nicht angemeldete Besucher öffnest, sieht jeder mit dem Link deinen Namen, dein Foto, deine Vorstellung und deine Tracks. Suchmaschinen bieten wir so ein Profil nicht an (wir bitten sie, es nicht zu indexieren), können aber nicht garantieren, dass der Link nirgends auftaucht.
privacy.s2.comments=<b>Kommentare und Stimmen:</b> Text des Kommentars, Datum und Stimmen bei Songs und Kommentaren. Kommentare sind öffentlich, auch mit dem Namen des Autors. Meldungen von Kommentaren sieht nur der Administrator.
privacy.s2.newsletter=<b>Neuigkeiten per E-Mail:</b> deine E-Mail und das Datum der Anmeldung und Bestätigung. Das Abo beginnt erst nach dem Klick auf den Link in der Bestätigungs-E-Mail, jede E-Mail enthält einen Abmeldelink (Einwilligung).
privacy.s2.security=<b>Sicherheit:</b> Deine IP-Adresse speichern wir kurz im Arbeitsspeicher des Servers, zum Schutz vor Spam und Passwort-Raten; kommt von ihr etwa einen Tag lang kein weiterer Versuch, wird sie vergessen. Sie erscheint auch in den technischen Protokollen des Servers. Beim Festlegen eines Passworts prüfen wir beim Dienst Have I Been Pwned, ob es auf anderen Websites geleakt wurde: Es werden nur die ersten 5 Zeichen seines SHA-1-Hashes gesendet, nie das Passwort oder deine Daten (berechtigtes Interesse – Sicherheit).
privacy.s2.stats=<b>Besucherzählung (ohne Cookies):</b> Wenn eine Seite angezeigt wird, berechnet die Website aus IP-Adresse und Browsertyp (bei angemeldeten Nutzern aus der Kontonummer) mit einem zufälligen Tagesschlüssel einen täglichen Fingerabdruck. Der Schlüssel wird jeden Tag um Mitternacht durch einen neuen ersetzt, daher lassen sich Fingerabdrücke verschiedener Tage nicht miteinander verbinden. Während des Tages, solange der Schlüssel gilt, könnte der Fingerabdruck eines angemeldeten Nutzers aber mit seinem Konto verbunden werden, deshalb betrachten wir ihn nicht als anonym. Gespeichert werden nur der Tag und der Fingerabdruck, IP-Adresse und Browsertyp speichern wir nicht. Er dient nur für Zahlen: wie viele Leute gerade auf der Website sind, wie viele an einem Tag kamen und wie oft ein Songtext gelesen wurde. Die Fingerabdrücke abgeschlossener Tage löschen wir am nächsten Tag, es bleibt nur die Zahl der Personen pro Tag (berechtigtes Interesse – Überblick über die Besuche).
privacy.s2.plays=<b>Was am meisten läuft (ohne Cookies):</b> Mit demselben täglichen Fingerabdruck wird gezählt, wie oft ein Songtext geöffnet, ein Video gestartet und das Karaoke-Kino betreten wurde. Jedes Element zählt für dich höchstens einmal am Tag, auch wenn du dich während des Besuchs anmeldest. Die Fingerabdrücke bei einzelnen Songs und Videos löschen wir am nächsten Tag, es bleiben nur die Summen. Dient für Übersichten in der Verwaltung (berechtigtes Interesse – Überblick darüber, was den Leuten gefällt).
privacy.s2.reports=<b>Ein Problem an Kevin melden (freiwillig):</b> der Text, den du schreibst, und die Adresse der Seite, auf der du warst; bei angemeldeten Besuchern auch dein Konto. Deine IP-Adresse speichern wir nicht. Nur der Administrator sieht es und löscht die Meldung, sobald das Problem behoben ist (berechtigtes Interesse – Fehler der Website beheben).
privacy.s2.help=<b>Ergänzen eines fehlenden Songtextes (freiwillig):</b> der Text, den du schreibst; bei angemeldeten Besuchern auch dein Konto. Deine IP-Adresse speichern wir nicht. Nur der Administrator sieht es und löscht es nach der Bearbeitung (berechtigtes Interesse – vollständige Songtexte).
privacy.s2.marketing=<b>Woher Besucher kommen (Statistik):</b> zu Beginn eines Besuchs zählen wir nur den Namen der Website, von der du kommst (z. B. instagram.com – nichts weiter von der Adresse), ein Kampagnen-Kennzeichen aus dem Link (z. B. ?z=ig-bio), die Geräteart (Handy / Tablet / Computer), die Sprache der Website und die Stunde. Ebenso zählen wir nur Klicks auf Links zu Spotify, Apple Music, YouTube und sozialen Netzwerken sowie Suchbegriffe unter Texte (nach 90 Tagen gelöscht). Gespeichert werden nur Tagessummen – keine Cookies, keine IP-Adresse, nichts davon lässt sich mit dir verbinden (berechtigtes Interesse – wissen, woher Fans kommen und was sie interessiert).
privacy.s2.trash=<b>Papierkorb in der Verwaltung:</b> löscht der Administrator einen Kommentar (oder einen Song bzw. ein Video samt Kommentaren), bleibt eine Kopie 30 Tage im Papierkorb, damit sich ein Versehen rückgängig machen lässt; danach wird sie endgültig gelöscht. Einen Kommentar, den du selbst löschst, bewahren wir nicht auf (berechtigtes Interesse – Schutz vor Versehen).
privacy.s2.social=<b>Freunde und Benachrichtigungen:</b> Freundschaftsanfragen, deine Liste von Freunden und blockierten Personen und Benachrichtigungen in der Glocke (Antworten, Herzen, Anfragen, Nachrichten, CatSmash). Wer blockiert ist, erfährt nichts davon, und von ihm bekommst du keine Benachrichtigungen. Meldungen eines Profils oder Kommentars (wer, wen, Grund und Notiz) sieht nur der Administrator.
privacy.s2.games=<b>CatSmash und Abzeichen:</b> Ergebnisse der Spiele gegen Kevin (Zeit, Punkte, Schwierigkeit), Rekorde, erhaltene Abzeichen, der gewählte Rahmen oder das Zeichen beim Namen und Abzeichen der Website (für Kommentare, Freunde, Karaoke und Ähnliches). Die Ergebnisse stehen in den Rekordtabellen, die jeder sehen kann. Deinen Namen und dein Foto sehen andere dort nur, wenn du unter Einstellungen → Privatsphäre „Mein Name in den CatSmash-Tabellen“ einschaltest. Sonst bist du dort ein anonymer Spieler und dein Profil zeigt anderen weder Zeiten noch Plätze in den Tabellen.
privacy.s2.rewards=<b>Aussehen und Belohnungen:</b> an welchen Tagen du auf der Website angemeldet warst (nur das Datum, ohne Uhrzeit und ohne das, was du gemacht hast), welche Belohnungen du freigeschaltet hast und welches Aussehen du gewählt hast (Profil-Look, Karaoke-Schrift und -Stil). Die Anzahl der Tage dient nur zum Freischalten von Belohnungen. Sie wird mit deinem Konto gelöscht und ist im Datenexport enthalten.
privacy.s2.tfa=<b>Zwei-Faktor-Authentifizierung (freiwillig):</b> Den Schlüssel für die App auf deinem Handy speichern wir verschlüsselt, die Backup-Codes nur als Hashes. Sie dienen nur der Anmeldung.
privacy.s3.t=Cookies und Browser-Speicher
privacy.s3.session=<b>Notwendiges Anmelde-Cookie</b> (JSESSIONID): ohne es funktioniert die Anmeldung nicht. Es gilt bis zum Schließen des Browsers, mit „Auf diesem Gerät merken“ 30 Tage.
privacy.s3.known=<b>Bekanntes Gerät</b> (skeliKnown): Nach einer erfolgreichen Anmeldung merkt sich dein Browser ein Jahr lang deine Kontonummer mit einer Signatur. Wenn ein Fremder versucht, dein Passwort zu erraten, und die Anmeldung bei deinem Konto deshalb vorübergehend gesperrt wird, kannst du dich von deinem eigenen Gerät weiter anmelden. Das Cookie öffnet von sich aus nichts, das Passwort ist immer nötig (berechtigtes Interesse – Sicherheit).
privacy.s3.storage=<b>Einstellungen im Browser</b> (localStorage und sessionStorage): deine Wahl in der Cookie-Leiste, heller oder dunkler Modus, Schrift und Textgröße, Einstellungen für Karaoke, Effekte und Töne, Kevins Einstellungen und das Spiel CatSmash (lokale Rekorde und freigeschaltete Dinge). Sie bleiben in deinem Browser und werden nicht von selbst an den Server geschickt. Ausnahme sind die Abzeichen aus einem CatSmash-Spiel, die das Spiel in deinem Konto speichert.
privacy.s4.t=Inhalte anderer Dienste
privacy.s4.p=YouTube-Videos und der Spotify-Player laden erst nach deiner Zustimmung in der Cookie-Leiste oder einem Klick auf „Player laden“. Dann sehen YouTube (Google) oder Spotify deine IP-Adresse und folgen ihren eigenen Richtlinien. Vorschaubilder, Schriften und Icons kommen von unserem eigenen Server. Links zu Instagram, Facebook, YouTube, Spotify und Apple Music führen auf deren Websites.
privacy.s5.t=Wer die Daten bekommt
privacy.s5.p=Wir verkaufen sie nie. Technisch verarbeitet sie der Betreiber des Servers und der E-Mail, auf dem die Website läuft (Hosting in Tschechien); E-Mails (Kontobestätigung, Passwort-Reset, Neuigkeiten) gehen über den Mailserver.
privacy.s6.t=Wie lange
privacy.s6.p=Konto und Profil bis zur Löschung des Kontos. Newsletter bis zur Abmeldung. Ein Link zum Zurücksetzen des Passworts gilt 30 Minuten, eine E-Mail-Bestätigung 48 Stunden. Nachrichten, Meldungen und Statistiken haben eigene Fristen, die oben beschrieben sind. Datenbank-Backups dienen nur der Wiederherstellung nach einem Ausfall.
privacy.s6.more=Problemmeldungen bis zu ihrer Erledigung. Deine Bewertung der Website bis zur Löschung deines Kontos.
privacy.s7.t=Konto löschen
privacy.s7.p=Unter Einstellungen → Konto löschen. Gelöscht werden Name, E-Mail, Passwort, Google-Anmeldung, Zwei-Faktor-Authentifizierung, Profilfoto, Profilbanner, Profil, deine Musik, Freunde und blockierte Personen, Benachrichtigungen, Nachrichten, Spielergebnisse und Abzeichen, Bewertung der Website und Newsletter-Abo, und du wirst auf allen Geräten abgemeldet. Kommentare bleiben mit dem Vermerk „Gelöschtes Konto“ und Stimmen bleiben gezählt, aber ohne Verbindung zu dir. Meldungen, die du geschickt hast, werden gelöscht, sobald der Administrator sie bearbeitet hat. Meldungen über dein Konto oder deine Nachrichten bleiben als Beweis bis zur Bearbeitung und danach höchstens ein Jahr (berechtigtes Interesse – Schutz der anderen Nutzer). Sollen auch deine Kommentare gelöscht werden? Schreib an <a href="mailto:skelimc@seznam.cz">skelimc@seznam.cz</a>.
privacy.s8.t=Deine Rechte
privacy.s8.p=Du hast das Recht auf Auskunft über deine Daten und deren Berichtigung und unter den gesetzlichen Bedingungen auch auf Löschung, Einschränkung der Verarbeitung und Übertragbarkeit. Du kannst Widerspruch einlegen und deine Einwilligung widerrufen, ohne dass dies die Verarbeitung vor dem Widerruf berührt. Deine Daten lädst du unter Einstellungen → Daten exportieren (JSON) herunter, dein Profil berichtigst du direkt in den Einstellungen. Anfragen schickst du an <a href="mailto:skelimc@seznam.cz">skelimc@seznam.cz</a>. Beschweren kannst du dich bei der tschechischen Datenschutzbehörde (<a href="https://uoou.gov.cz" target="_blank" rel="noopener">uoou.gov.cz</a>).
privacy.s9.t=Alter
privacy.s9.p=Wenn du jünger als 15 bist, brauchst du für die Registrierung die Zustimmung eines Elternteils oder Erziehungsberechtigten.
