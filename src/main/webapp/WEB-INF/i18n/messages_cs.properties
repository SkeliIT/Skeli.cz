# --- GDPR, soukromí, podmínky
privacy.heading=Zásady ochrany osobních údajů
terms.heading=Podmínky používání
terms.updated=Platné od 8. 10. 2026
terms.lead=Pár jasných pravidel, aby tu bylo dobře všem – fanouškům, kritikům i Skelimu.
terms.s1.t=O webu
terms.s1.p=Web skeli.cz je oficiální web Skeliho. Provozuje ho Radek Dvořák (Skeli), kontakt <a href="mailto:skelimc@seznam.cz">skelimc@seznam.cz</a>. Číst texty, poslouchat a koukat můžeš bez účtu; účet potřebuješ jen ke komentářům a hlasování.
terms.s2.t=Tvůj účet
terms.s2.p=Jeden člověk = jeden účet. Uveď e-mail, ke kterému máš přístup, a heslo nikomu nedávej – za to, co se z tvého účtu napíše, odpovídáš ty. Pokud je ti méně než 15 let, potřebuješ souhlas rodiče. Účet můžeš kdykoli smazat v Nastavení.
terms.s3.t=Pravidla komunity
terms.s3.p=Kritika tvorby je v pořádku, hejtování lidí ne. V komentářích je zakázané:
terms.rule1=spam, reklama a opakované vkládání stejného textu,
terms.rule2=urážky, šikana a napadání jiných lidí,
terms.rule3=nenávist kvůli původu, národnosti, náboženství, pohlaví, sexualitě, zdraví nebo podobně,
terms.rule4=výhrůžky a vyzývání k násilí,
terms.rule5=zveřejňování cizích osobních údajů (adresa, telefon, fotky…) – tzv. doxxing,
terms.rule6=nezákonný obsah a odkazy na podvodné nebo škodlivé stránky,
terms.rule7=vydávání se za někoho jiného (třeba za Skeliho).
terms.s4.t=Nahlášení a moderace
terms.s4.p=Komentář, který porušuje pravidla, nahlas tlačítkem u komentáře. Nahlášení vidí jen administrátor a rozhodne o něm: komentář nechá, upraví, nebo smaže. Při závažném nebo opakovaném porušení může smazat i účet. Nesouhlasíš s rozhodnutím? Napiš na <a href="mailto:skelimc@seznam.cz">skelimc@seznam.cz</a> a podíváme se na to znovu.
terms.s5.t=Tvoje komentáře
terms.s5.p=Co napíšeš, zůstává tvoje. Odesláním souhlasíš, aby se komentář na webu veřejně zobrazoval. Vlastní komentář můžeš upravit nebo smazat. Po smazání účtu komentáře zůstanou pod označením „Smazaný účet“; chceš-li je smazat také, napiš nám.
terms.s6.t=Obsah webu
terms.s6.p=Hudba, texty písní, klipy, fotky a logo patří Skelimu (případně spoluautorům). Odkazy sdílej, jak chceš; kopírovat a dál šířit celé texty, fotky nebo nahrávky jde jen s jeho souhlasem.
terms.s7.t=Služby jiných firem
terms.s7.p=Videa, hudba a odkazy vedou na YouTube, Spotify, Apple Music, Instagram a Facebook. Ty mají vlastní podmínky a zásady; jak s nimi web pracuje, popisují <a href="/privacy.jsp">Zásady ochrany osobních údajů</a>.
terms.s8.t=Bez záruky
terms.s8.p=Web děláme s láskou, ale bez záruky, že poběží vždy a bez chyby. Funkce se můžou měnit, přibývat i mizet.
terms.s9.t=Změny podmínek
terms.s9.p=Když se pravidla změní, upravíme datum nahoře na stránce. Větší změny oznámíme na webu.

