consent.spotify=Přehrávač Spotify se načítá ze serverů Spotify, které tím uvidí tvou IP adresu. Načte se po kliknutí nebo po souhlasu v cookie liště.
privacy.updated=Platné od 5. 11. 2026
privacy.lead=Tady se dozvíš, jaké osobní údaje skeli.cz zpracovává, proč, jak dlouho je uchovává a jaká máš práva.
privacy.s1.t=Kdo za web odpovídá
privacy.s1.p=Správcem osobních údajů je Radek Dvořák (Skeli). V otázkách soukromí mi piš na <a href="mailto:skelimc@seznam.cz">skelimc@seznam.cz</a>. Na stejnou adresu můžeš poslat i žádost o přístup k údajům, jejich opravu nebo smazání.
privacy.s2.t=Co zpracováváme a proč
privacy.s2.account=<b>Účet:</b> uživatelské jméno, e-mail, heslo (jen jako otisk bcrypt, samotné heslo neznáme), datum registrace a potvrzení e-mailu. Slouží k provozu účtu a funkcí pro přihlášené, například komentářů a hlasování (plnění smlouvy, tedy podmínek používání).
privacy.s2.profile=<b>Profil (nepovinný):</b> zobrazované jméno, věk, město, pár slov o sobě, profilová fotka, záhlaví profilu, vzhled a jazyk webu. Vyplňuješ jen to, co chceš, a kdykoli to změníš nebo smažeš (souhlas). Žádosti o přátelství a zablokované lidi vidíš jen ty. Jestli ostatní přihlášení uvidí tvoje město, pár slov o tobě, písně se srdcem, přátele, stav online nebo poslední aktivitu, rozhoduješ v Nastavení → Soukromí. Když přidáš svoji tvorbu, uložíme název, rok a odkazy na skladby; ostatní přihlášení je uvidí, dokud to nevypneš. Když si zapneš profil i pro nepřihlášené, jméno, fotku, představení a skladby uvidí kdokoli s odkazem. Vyhledávačům takový profil nenabízíme (posíláme jim pokyn, aby ho neindexovaly), nemůžeme ale zaručit, že se odkaz nikde neobjeví.
privacy.s2.comments=<b>Komentáře a hlasy:</b> text komentáře, datum a hlasy u písní a komentářů. Komentáře jsou veřejné i se jménem autora. Nahlášení komentáře vidí jen administrátor.
privacy.s2.newsletter=<b>Novinky e-mailem:</b> e-mail a datum přihlášení a potvrzení. Odběr začne až po kliknutí na odkaz v potvrzovacím e-mailu a zrušíš ho odkazem v každém e-mailu (souhlas).
privacy.s2.security=<b>Bezpečnost:</b> IP adresu držíme krátce v paměti serveru kvůli ochraně proti spamu a hádání hesel; když z ní zhruba den nepřijde další pokus, zapomene se. Objevuje se také v technických záznamech serveru. Při nastavování hesla ověřujeme ve službě Have I Been Pwned, jestli heslo neuniklo z jiných webů: odchází jen prvních 5 znaků jeho otisku SHA-1, nikdy heslo ani tvoje údaje (oprávněný zájem – bezpečnost).
privacy.s2.stats=<b>Počítání návštěv (bez cookies):</b> když se stránka zobrazí, web z IP adresy a typu prohlížeče (u přihlášených z čísla účtu) spočítá denní otisk pomocí náhodného klíče dne. Klíč se každý den o půlnoci nahradí novým, takže otisky z různých dní nejde spojit mezi sebou. Během dne, kdy klíč ještě platí, by se ale otisk přihlášeného dal spojit s jeho účtem, proto ho nepovažujeme za anonymní. Ukládá se jen den a otisk, IP adresu ani typ prohlížeče neukládáme. Slouží jen k číslům: kolik lidí je právě na webu, kolik jich přišlo za den a kolikrát byl přečtený text písně. Otisky uzavřených dnů mažeme hned druhý den, zůstává jen počet lidí za den (oprávněný zájem – přehled o návštěvnosti).
privacy.s2.plays=<b>Co se nejvíc pouští (bez cookies):</b> stejným denním otiskem se počítá, kolikrát se otevřel text písně, spustilo video a vstoupilo do karaoke kina. Každá věc se ti započítá nejvýš jednou za den, i když se během návštěvy přihlásíš. Otisky u jednotlivých písní a videí mažeme hned další den, zůstávají jen součty. Slouží k přehledům v administraci (oprávněný zájem – přehled o tom, co lidi baví).
privacy.s2.reports=<b>Nahlášení problému Kevinovi (nepovinné):</b> text, který napíšeš, a adresa stránky, na které jsi byl; u přihlášených i tvůj účet. IP adresu neukládáme. Vidí to jen administrátor a hlášení smaže, jakmile problém vyřeší (oprávněný zájem – oprava chyb webu).
privacy.s2.help=<b>Doplnění chybějícího textu písně (nepovinné):</b> text, který napíšeš; u přihlášených i tvůj účet. IP adresu neukládáme. Vidí to jen administrátor a po zpracování to smaže (oprávněný zájem – úplné texty písní).
privacy.s2.marketing=<b>Odkud lidé na web přicházejí (statistiky):</b> na začátku návštěvy sečteme jen název webu, ze kterého jsi přišel (např. instagram.com – nic víc z adresy), štítek kampaně z odkazu (např. ?z=ig-bio), druh zařízení (mobil / tablet / počítač), jazyk webu a hodinu. Stejně jen sčítáme kliknutí na odkazy na Spotify, Apple Music, YouTube a sociální sítě a výrazy hledané v Textech (ty mažeme po 90 dnech). Ukládají se jen počty za den – bez cookies, bez IP adresy, nic z toho nejde spojit s tebou (oprávněný zájem – vědět, odkud fanoušci chodí a co je zajímá).
privacy.s2.trash=<b>Koš v administraci:</b> když administrátor smaže komentář (nebo píseň či video i s komentáři pod nimi), zůstane jeho kopie 30 dní v koši, aby šel omyl vrátit; pak se smaže natrvalo. Komentář, který smažeš sám, se neuchovává (oprávněný zájem – ochrana před omylem).
privacy.s2.social=<b>Přátelé a upozornění:</b> žádosti o přátelství, seznam přátel a zablokovaných lidí a upozornění ve zvonečku (odpovědi, srdíčka, žádosti, zprávy, CatSmash). Kdo je zablokovaný, nic se o tom nedozví a od něj ti nepřijde žádné upozornění. Nahlášení profilu nebo komentáře (kdo, koho, důvod a poznámka) vidí jen administrátor.
privacy.s2.games=<b>CatSmash a odznaky:</b> výsledky zápasů s Kevinem (čas, skóre, obtížnost), rekordy, získané odznaky, vybraný rámeček nebo znak u jména a odznaky z webu (za komentáře, přátele, karaoke a podobně). Výsledky jsou v tabulkách rekordů, které vidí každý. Tvoje jméno a fotku tam ostatní uvidí jen tehdy, když si v Nastavení → Soukromí zapneš „Moje jméno v tabulkách CatSmash“. Jinak jsi tam anonymní hráč a tvůj profil ostatním neukazuje časy ani místa v tabulkách.
privacy.s2.rewards=<b>Vzhled a odměny:</b> ve kterých dnech jsi byl přihlášený na webu (jen datum, bez času a bez toho, co jsi dělal), které odměny máš odemčené a jaký vzhled jsi si vybral (vzhled profilu, písmo a styl karaoke). Počet dní slouží jen k odemykání odměn. Smaže se se smazáním účtu a najdeš ho v exportu dat.
privacy.s2.tfa=<b>Dvoufázové ověření (nepovinné):</b> klíč pro aplikaci v telefonu ukládáme zašifrovaný a záložní kódy jen jako otisky. Slouží jen k přihlášení.
privacy.s3.t=Cookies a úložiště prohlížeče
privacy.s3.session=<b>Nezbytná cookie přihlášení</b> (JSESSIONID): bez ní nejde přihlášení. Platí do zavření prohlížeče, se „Zapamatovat na tomto zařízení“ 30 dní.
privacy.s3.known=<b>Známé zařízení</b> (skeliKnown): po úspěšném přihlášení si prohlížeč na rok zapamatuje číslo tvého účtu s podpisem. Když někdo cizí zkouší uhodnout tvoje heslo a účet se kvůli tomu dočasně zablokuje, ze svého zařízení se přihlásíš dál. Cookie sama nic neotevírá, heslo je potřeba vždy (oprávněný zájem – bezpečnost).
privacy.s3.storage=<b>Nastavení v prohlížeči</b> (localStorage a sessionStorage): tvoje volba v cookie liště, světlý nebo tmavý režim, písmo a velikost textu, nastavení karaoke, efektů a zvuků, nastavení Kevina a hry CatSmash (místní rekordy a odemčené věci). Zůstávají ve tvém prohlížeči a samy se na server neposílají. Výjimkou jsou odznaky ze zápasu CatSmash, které hra uloží k tvému účtu.
privacy.s4.t=Obsah z jiných služeb
privacy.s4.p=Videa z YouTube a přehrávač Spotify se načtou až po tvém souhlasu v cookie liště nebo po kliknutí na „Načíst přehrávač“. Pak YouTube (Google) nebo Spotify uvidí tvou IP adresu a řídí se svými zásadami. Náhledy videí, písma a ikony posíláme z vlastního serveru. Odkazy na Instagram, Facebook, YouTube, Spotify a Apple Music vedou na jejich weby.
privacy.s5.t=Komu údaje předáváme
privacy.s5.p=Nikomu je neprodáváme. Technicky je zpracovává provozovatel serveru a pošty, na kterém web běží (hosting v Česku); přes poštovní server odcházejí e-maily (potvrzení účtu, obnova hesla, novinky).
privacy.s6.t=Jak dlouho
privacy.s6.p=Účet a profil do smazání účtu. Odběr novinek do odhlášení. Odkaz na obnovu hesla platí 30 minut, potvrzení e-mailu 48 hodin. Zprávy, nahlášení a statistiky mají vlastní lhůty popsané výše. Zálohy databáze slouží jen k obnově po poruše.
privacy.s6.more=Hlášení problémů do vyřešení. Hodnocení webu do smazání účtu.
privacy.s7.t=Smazání účtu
privacy.s7.p=V Nastavení → Smazat účet. Smaže se jméno, e-mail, heslo, přihlášení přes Google, dvoufázové ověření, profilová fotka, záhlaví profilu, profil, tvorba, přátelé a zablokovaní, upozornění, zprávy, výsledky ve hrách a odznaky, hodnocení webu i odběr novinek a odhlásíš se na všech zařízeních. Komentáře zůstanou s označením „Smazaný účet“ a hlasy zůstanou započítané, už bez vazby na tebe. Nahlášení, která jsi poslal, se smažou, jakmile je administrátor vyřídí. Nahlášení na tvůj účet nebo tvoje zprávy zůstanou jako důkaz do vyřízení a pak nejvýš rok (oprávněný zájem – ochrana ostatních uživatelů). Chceš smazat i komentáře? Napiš na <a href="mailto:skelimc@seznam.cz">skelimc@seznam.cz</a>.
privacy.s8.t=Tvoje práva
privacy.s8.p=Máš právo na přístup ke svým údajům a jejich opravu a za podmínek daných zákonem také na výmaz, omezení zpracování a přenositelnost. Můžeš vznést námitku a odvolat souhlas, aniž by to ovlivnilo zpracování před odvoláním. Svá data si stáhneš v Nastavení → Export dat (JSON) a profil opravíš přímo v Nastavení. S žádostmi se obrať na <a href="mailto:skelimc@seznam.cz">skelimc@seznam.cz</a>. Stížnost můžeš podat u Úřadu pro ochranu osobních údajů (<a href="https://uoou.gov.cz" target="_blank" rel="noopener">uoou.gov.cz</a>).
privacy.s9.t=Věk
privacy.s9.p=Pokud ti ještě nebylo 15 let, potřebuješ k registraci souhlas rodiče nebo zákonného zástupce.
