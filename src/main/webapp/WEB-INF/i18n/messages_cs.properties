# --- GDPR, soukromí, podmínky
privacy.heading=Zásady ochrany osobních údajů
terms.heading=Podmínky používání
terms.updated=Platné od 5. 11. 2026
terms.lead=Jednoduchá pravidla, díky kterým může být skeli.cz příjemným místem pro všechny.
terms.s1.t=O webu
terms.s1.p=Skeli.cz je oficiální web rappera Skeliho, který provozuje Radek Dvořák. Kontaktovat mě můžeš na <a href="mailto:skelimc@seznam.cz">skelimc@seznam.cz</a>. Hudbu, videa a texty si můžeš prohlížet bez registrace. Některé funkce, například komentáře, hlasování, zprávy nebo karaoke, vyžadují účet.
terms.s2.t=Tvůj účet
terms.s2.p=Každý může mít jen jeden účet. Při registraci použij e-mail, ke kterému máš přístup, a heslo s nikým nesdílej. Pokud máš podezření, že někdo tvůj účet zneužil, změň si heslo a napiš mi. Jestli ti ještě nebylo 15 let, potřebuješ k registraci souhlas rodiče nebo zákonného zástupce. Účet můžeš kdykoli smazat v Nastavení. Do Mojí tvorby přidávej jen skladby, které jsi vytvořil nebo ke kterým máš potřebná práva. Skladbu, která porušuje práva jiných, můžu skrýt. Pravidla slušného chování platí i pro soukromé zprávy. Za závažné nebo opakované porušování pravidel může být účet zablokován nebo smazán.
terms.s3.t=Pravidla komunity
terms.s3.p=Hudbu i názory ostatních můžeš kritizovat, osobní útoky ale na web nepatří. V komentářích, zprávách, na profilu, profilové fotce, v záhlaví profilu i v Mojí tvorbě je zakázané:
terms.rule1=spam, nevyžádaná reklama a opakované zveřejňování stejného obsahu,
terms.rule2=urážky, šikana a cílené obtěžování ostatních,
terms.rule3=nenávist vůči lidem kvůli původu, národnosti, víře, pohlaví, sexuální orientaci, zdravotnímu stavu nebo podobně,
terms.rule4=výhrůžky, vyzývání k násilí a jeho oslavování,
terms.rule5=zveřejňování cizích osobních údajů bez svolení, například adresy, telefonu nebo soukromých fotek,
terms.rule6=nezákonný obsah a odkazy na podvodné nebo škodlivé stránky,
terms.rule7=vydávání se za jiného člověka, třeba za Skeliho,
terms.rule8=nabízení nebo shánění drog, zbraní a dalších nelegálních věcí,
terms.rule9=pornografie a sexuální obsah. Obsah zobrazující sexuální zneužívání dětí a další podezření na závažnou trestnou činnost týkající se dětí řešíme přednostně. V případech stanovených zákonem informujeme příslušné orgány, v ostatních případech jim můžeme podezření oznámit.
terms.s4.t=Nahlášení a moderace
terms.s4.p=Komentář, profil nebo zprávu, které porušují pravidla, můžeš nahlásit tlačítkem u nich. Nahlášení posoudí administrátor a podle situace obsah ponechá, upraví nebo smaže. Skladbu v Mojí tvorbě může skrýt. Při závažném nebo opakovaném porušování pravidel může účet zablokovat nebo smazat. Nezákonný obsah a podezření na ohrožení dítěte řešíme přednostně; kdy informujeme příslušné orgány, popisuje poslední bod Pravidel komunity výše. Soukromé zprávy administrátor běžně nečte, v administraci uvidí jen zprávu, kterou mu někdo nahlásí. Jak jsou zprávy chráněné, popisují <a href="/privacy.jsp">Zásady ochrany osobních údajů</a>. Pro nahlášení i pro kontakt ze strany úřadů slouží <a href="mailto:skelimc@seznam.cz">skelimc@seznam.cz</a> (česky nebo anglicky). Pokud s rozhodnutím nesouhlasíš, napiš na stejnou adresu a požádej o nové posouzení.
terms.s5.t=Tvoje komentáře
terms.s5.p=Co napíšeš, zůstává tvoje. Odesláním souhlasíš s tím, že se komentář bude na webu veřejně zobrazovat. Svůj komentář můžeš upravit nebo smazat. Když smažeš účet, komentáře zůstanou s označením „Smazaný účet“ a bez vazby na tvůj profil. Pokud chceš smazat i je, napiš na <a href="mailto:skelimc@seznam.cz">skelimc@seznam.cz</a>.
terms.s6.t=Obsah webu
terms.s6.p=Hudba, texty písní, videa, fotky a logo patří Skelimu, případně spoluautorům a dalším držitelům práv. Odkazy na tvorbu sdílej, jak chceš. Kopírovat a dál šířit celé texty, fotky nebo nahrávky jde jen se svolením držitele práv, pokud to přímo nedovoluje zákon.
terms.s7.t=Služby jiných firem
terms.s7.p=Na webu najdeš obsah a odkazy ze služeb YouTube, Spotify, Apple Music, SoundCloud, Instagram a Facebook a přihlásit se můžeš i přes Google. Tyto služby mají vlastní podmínky a zásady. Jak s nimi web pracuje, popisují <a href="/privacy.jsp">Zásady ochrany osobních údajů</a>.
terms.s8.t=Bez záruky
terms.s8.p=Snažím se, aby web fungoval co nejlépe, přesto se může objevit chyba nebo výpadek. Funkce se časem můžou měnit, přibývat i mizet. Tím nejsou dotčena práva, která ti dávají zákony.
terms.s9.t=Změny podmínek
terms.s9.p=Když se podmínky změní, zveřejníme nové znění a datum, od kdy platí. O důležitých změnách dáme vědět na webu.

