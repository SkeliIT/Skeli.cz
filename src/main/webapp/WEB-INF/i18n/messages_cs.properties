privacy.updated=Platné od 22. 10. 2026
privacy.lead=Srozumitelně a po pravdě: jaké údaje web skeli.cz zpracovává, proč, jak dlouho a co s nimi můžeš udělat.
privacy.s1.t=Kdo za web odpovídá
privacy.s1.p=Správcem osobních údajů je Radek Dvořák (Skeli), e-mail <a href="mailto:skelimc@seznam.cz">skelimc@seznam.cz</a>. Na tenhle e-mail piš i všechny žádosti týkající se tvých údajů.
privacy.s2.t=Co zpracováváme a proč
privacy.s2.account=<b>Účet:</b> uživatelské jméno, e-mail, heslo (jen jako zašifrovaný otisk bcrypt – samotné heslo neznáme), datum registrace a potvrzení e-mailu. Slouží k provozu účtu, komentářům a hlasování (plnění smlouvy – podmínky používání).
privacy.s2.profile=<b>Profil (nepovinný):</b> zobrazované jméno, věk, město, pár slov o sobě, profilová fotka, vzhled a jazyk webu. Vyplňuješ jen to, co chceš, a kdykoli to změníš nebo smažeš (souhlas).
privacy.s2.comments=<b>Komentáře a hlasy:</b> text komentáře, datum a hlasy u písní a komentářů. Komentáře jsou veřejné. Nahlášení komentáře vidí jen administrátor.
privacy.s2.newsletter=<b>Novinky e-mailem:</b> e-mail a datum přihlášení a potvrzení. Odběr začne až po kliknutí na odkaz v potvrzovacím e-mailu a zrušíš ho odkazem v každém e-mailu (souhlas).
privacy.s2.security=<b>Bezpečnost:</b> IP adresa se krátce drží v paměti serveru kvůli ochraně proti spamu a hádání hesel a objevuje se v technických záznamech serveru. Při nastavování hesla ověřujeme, jestli se neobjevilo v únicích dat (služba Have I Been Pwned): odchází jen prvních 5 znaků otisku hesla, nikdy heslo ani tvoje údaje (oprávněný zájem – bezpečnost).
privacy.s2.stats=<b>Počítání návštěv (bez cookies):</b> když se stránka zobrazí, web si z IP adresy a typu prohlížeče (u přihlášených z čísla účtu) spočítá anonymní otisk. Klíč k němu se každý den o půlnoci zahodí a vytvoří nový, takže tě podle otisku nejde poznat a návštěvy z různých dní nejdou spojit. Slouží jen k číslům: kolik lidí je právě na webu, kolik jich přišlo za den a kolikrát byl přečtený text písně (každý text se ti započítá nejvýš jednou za den). IP adresu ani prohlížeč neukládáme (oprávněný zájem – přehled o návštěvnosti).
privacy.s2.plays=<b>Co se nejvíc pouští (bez cookies):</b> stejným denním otiskem jako u návštěv se počítá, kolikrát se otevřel text písně, spustil klip a vstoupilo do karaoke kina – každá věc se ti započítá nejvýš jednou za den. Když se během návštěvy přihlásíš, ten den se počítáš jen jednou. Slouží jen k žebříčkům v administraci (oprávněný zájem – přehled o tom, co lidi baví).
privacy.s2.reports=<b>Nahlášení problému Kevinovi (nepovinné):</b> text, který napíšeš, a adresa stránky, na které jsi byl; u přihlášených i tvůj účet. IP adresu neukládáme. Vidí to jen administrátor a hlášení smaže, jakmile problém vyřeší (oprávněný zájem – oprava chyb webu).
privacy.s2.help=<b>Doplnění chybějícího textu písně (nepovinné):</b> text, který napíšeš; u přihlášených i tvůj účet. IP adresu neukládáme. Vidí to jen administrátor a po zpracování to smaže (oprávněný zájem – úplné texty písní).
privacy.s2.marketing=<b>Odkud lidé na web přicházejí (statistiky):</b> na začátku návštěvy sečteme jen název webu, ze kterého jsi přišel (např. instagram.com – nic víc z adresy), štítek kampaně z odkazu (např. ?z=ig-bio), druh zařízení (mobil / tablet / počítač), jazyk webu a hodinu. Stejně jen sčítáme kliknutí na odkazy na Spotify, Apple Music, YouTube a sociální sítě a výrazy hledané v Textech (ty mažeme po 90 dnech). Ukládají se jen počty za den – bez cookies, bez IP adresy, nic z toho nejde spojit s tebou (oprávněný zájem – vědět, odkud fanoušci chodí a co je zajímá).
privacy.s2.trash=<b>Koš v administraci:</b> když administrátor smaže komentář (nebo píseň či klip i s komentáři pod nimi), zůstane jeho kopie 30 dní v koši, aby šel omyl vrátit; pak se smaže natrvalo. Komentář, který smažeš sám, se neuchovává (oprávněný zájem – ochrana před omylem).
privacy.s3.t=Cookies a úložiště prohlížeče
privacy.s3.session=<b>Nezbytná cookie přihlášení</b> (JSESSIONID): bez ní nejde přihlášení. Platí do zavření prohlížeče, se „Zapamatovat na tomto zařízení“ 30 dní.
privacy.s3.storage=<b>Nastavení v prohlížeči</b> (localStorage): tvoje volba v cookie liště, světlý/tmavý režim, velikost písma u textů, stav přehrávače Spotify a nastavení MC Kevina. Zůstávají jen ve tvém prohlížeči, na server se neposílají.
privacy.s3.matomo=<b>Měření návštěvnosti</b> nástrojem Matomo na serveru provozovatele webu (ne u Googlu) – načte se, až když ho v cookie liště povolíš („Přijmout vše“ nebo „Nastavit“ → Měření návštěvnosti). Do té doby se na měřicí server nic neposílá. Souhlas kdykoli změníš nebo odvoláš odkazem „Nastavení cookies“ v patičce.
privacy.s4.t=Obsah z jiných služeb
privacy.s4.p=Videa z YouTube a přehrávač Spotify se načtou až po tvém souhlasu v cookie liště nebo po kliknutí na „Načíst přehrávač“. Pak YouTube (Google) nebo Spotify uvidí tvou IP adresu a řídí se svými zásadami. Náhledy klipů, písma a ikony posíláme z vlastního serveru. Odkazy na Instagram, Facebook, YouTube, Spotify a Apple Music vedou na jejich weby.
privacy.s5.t=Komu údaje předáváme
privacy.s5.p=Nikomu je neprodáváme. Technicky je zpracovává provozovatel serveru a pošty, na kterém web běží (hosting v Česku); přes poštovní server odcházejí e-maily (potvrzení účtu, obnova hesla, novinky).
privacy.s6.t=Jak dlouho
privacy.s6.p=Účet a profil do smazání účtu. Odběr novinek do odhlášení. Odkaz na obnovu hesla platí 30 minut, potvrzení e-mailu 48 hodin. Zálohy databáze slouží jen k obnově po poruše.
privacy.s6.more=Hlášení problémů do vyřešení. Hodnocení webu do smazání účtu.
privacy.s7.t=Smazání účtu
privacy.s7.p=V Nastavení → Smazat účet. Smaže se jméno, e-mail, heslo, profilová fotka, profil, nahlášení i odběr novinek a odhlásíš se na všech zařízeních. Komentáře zůstanou pod označením „Smazaný účet“ a hlasy zůstanou započítané, už bez vazby na tebe. Chceš smazat i komentáře? Napiš na <a href="mailto:skelimc@seznam.cz">skelimc@seznam.cz</a>.
privacy.s8.t=Tvoje práva
privacy.s8.p=Máš právo na přístup ke svým údajům (Nastavení → Export dat (JSON)), jejich opravu (Nastavení), výmaz, omezení zpracování, přenositelnost (stažená data jsou ve formátu JSON), námitku a odvolání souhlasu. Stížnost můžeš podat u Úřadu pro ochranu osobních údajů (<a href="https://uoou.gov.cz" target="_blank" rel="noopener">uoou.gov.cz</a>).
privacy.s9.t=Věk
privacy.s9.p=Pokud je ti méně než 15 let, požádej o souhlas s registrací rodiče.
