email.register.subject=Vítejte na Skeli.cz – registrace úspěšně dokončena
email.register.body=Vítejte na Skeli.cz!\n\nVáš účet „{username}“ byl úspěšně vytvořen.\n\nNyní se můžete přihlásit na našich stránkách:\n{link}\n\nDěkujeme za registraci a těšíme se na vaši účast v naší komunitě!\n\nS pozdravem,\nTým Skeli.cz
email.reset.subject=Skeli.cz – obnovení hesla
email.reset.body=Dobrý den,\n\nobdrželi jsme žádost o obnovení hesla k vašemu účtu na Skeli.cz.\n\nPokud chcete obnovit heslo, klikněte na následující odkaz (platí 30 minut):\n{link}\n\nPokud jste o obnovení hesla nežádali, ignorujte tento e-mail.\n\nS pozdravem,\nTým Skeli.cz
