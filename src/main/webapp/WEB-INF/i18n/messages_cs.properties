email.verify.body=Ahoj {username},\n\ndíky za registraci na Skeli.cz! Potvrď prosím svůj e-mail kliknutím na odkaz (platí 48 hodin):\n{link}\n\nPokud o registraci nevíš, tento e-mail ignoruj.\n\nSkeli
about.intro1=Jmenuju se Radek Dvořák, ročník 1992. 🦖
about.intro2=Hudebně vystupuju pod jménem Skeli a hudbě se věnuju už od svých patnácti let.
about.selftaught.text=Jsem český rapper/zpěvák a především samouk. Nemám za sebou hudební školu ani žádné formální vzdělání v hudbě. Všechno jsem se postupně učil sám – od psaní textů, přes nahrávání až po práci se zvukem a tvorbu videí. A pořád se učím dál, protože mám pocit, že člověk se v hudbě nikdy nedostane do bodu, kdy už ví všechno.
about.work.text=Mimo hudbu jsem původně pracoval jako instalatér. Vyzkoušel jsem si také několik fabrik, které mi poměrně rychle ukázaly jednu důležitou věc:
about.work.quote=Fabrika fakt ne.
about.why.p1=Hudba je pro mě hlavně způsob, jak zachytit věci, které člověk zažívá, přemýšlí nad nimi nebo je prostě nechce nechat jen tak projít hlavou. Někdy je to příběh, někdy nálada, někdy obyčejná životní situace a někdy zase něco, co mě pořádně naštve. Každá skladba tak může vzniknout z úplně jiného důvodu.
about.why.p2=Nemám potřebu se držet jednoho tématu nebo jednoho stylu. Baví mě zkoušet nové věci a posouvat se dál – ať už jde o samotné psaní, nahrávání, zvuk, videoklip nebo celkovou prezentaci hudby.
about.squad.p1=Velkou součástí mé cesty je také Skelo Squad.
about.squad.p2=Skelo Squad není jen název, který používám na konci svých příspěvků. Je to můj sen vybudovat časem vlastní hudební label, pod kterým by mohli vystupovat další umělci a společně tvořit něco většího.
about.squad.p3=Zatím je Skelo Squad malý tým. Aktuálně jsem jeho součástí já a moje přítelkyně, se kterou jsme spolu už přes deset let. Pomáhá mi se sociálními sítěmi, tvorbou videoklipů a celkově stojí za spoustou věcí, které nejsou na první pohled vidět.
about.squad.p4=Možná tedy zatím nejsme žádný velký label.
about.squad.p5=Ale každý někde začíná.
about.squad.p6=A právě proto chci Skelo Squad postupně budovat dál – jako místo pro vlastní tvorbu, spolupráci a jednou třeba i pro další umělce, kteří budou chtít být jeho součástí.
about.outro=Jsem Skeli. Tohle je moje hudba, moje cesta a začátek Skelo Squad. 🖤
about.signature=Skelo Squad.
about.music.title=Hudební cesta
about.music.text=Od prvních tracků až po současnou tvorbu. Na stránce Hudba najdete klipy a playlisty.
about.collab.title=Spolupráce
about.collab.text=Jestli tě baví moje věci, napiš. Ocením rap feature, produkci beatů i vizuál.
