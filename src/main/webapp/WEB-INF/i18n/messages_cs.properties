email.verify.body=Ahoj {username},\n\ndíky za registraci na Skeli.cz! Potvrď prosím svůj e-mail kliknutím na odkaz (platí 48 hodin):\n{link}\n\nPokud o registraci nevíš, tento e-mail ignoruj.\n\nSkeli
about.intro1=Jmenuju se Radek Dvořák, ročník 1992. 🦖 Hudebně vystupuju pod jménem <strong>Skeli</strong> a hudbě se věnuju už od svých patnácti let.
about.selftaught.text=Jsem samouk. Všechno jsem se postupně učil sám, od psaní textů přes nahrávání a práci se zvukem až po tvorbu videoklipů. Baví mě experimentovat, hledat vlastní zvuk a zkoušet nové věci. Nechci se držet jedné škatulky. Každá skladba má svůj příběh a důvod, proč vznikla.
about.web.text=Stejnou cestou jsem se vydal i mimo hudbu. <strong>Skeli.cz jsem si vytvořil sám</strong>, protože jsem chtěl mít vlastní prostor, kde můžu svou tvorbu představit podle svých představ. Od prvních nápadů až po samotné fungování webu je to další část mého projektu, kterou si buduju vlastníma rukama.
about.squad.title=Skelo Squad 🖤
about.squad.p1=Mým snem je vybudovat vlastní hudební label, který ponese název <strong>Skelo Squad</strong>. Místo, kde by mohli vznikat nové projekty, spolupracovat umělci a společně tvořit něco většího.
about.squad.p2=Zatím jsme na začátku. Tvořím ho společně se svou přítelkyní Andy, která mi pomáhá se sociálními sítěmi, videoklipy a dalšími věcmi kolem mé tvorby.
about.squad.p3=Pořád se učím, hledám nové možnosti a posouvám se dál. Nechci zůstat jen u nápadů. Chci je postupně měnit ve skutečnost.
about.outro=<strong>Jsem Skeli. Tohle je moje hudba, moje vize a svět, který si buduju po svém.</strong> 🤘
about.signature=Skelo Squad.
about.music.title=Hudební cesta
about.music.text=Od prvních tracků až po současnou tvorbu. Na stránce Hudba najdete klipy a playlisty.
about.collab.title=Spolupráce
about.collab.text=Jestli tě baví moje věci, napiš. Ocením rap feature, produkci beatů i vizuál.
