privacy.s2.chat=<b>Zprávy (nepovinné):</b> text, čas, kdo komu psal a jestli je zpráva přečtená. Ukládáme je, abyste si je mohli přečíst. V databázi je text zašifrovaný a v administraci webu se nedá číst, administrátor uvidí jen zprávu, kterou někdo nahlásí. Není to šifrování mezi dvěma zařízeními: správce serveru, který má i klíč, by se k nim technicky dostat mohl. Zprávy se po roce samy mažou. Svoji zprávu nebo celou konverzaci můžeš smazat kdykoli; konverzace zmizí u tebe, a až ji smaže i ten druhý, zmizí úplně. Smazáním účtu zmizí všechny tvoje konverzace. Kopie nahlášené zprávy zůstává, dokud to administrátor nevyřídí, a pak nejdéle rok. Odkaz z YouTube, Spotify, Apple Music nebo SoundCloudu dostane ve zprávě kartu. Přehrávač se načte až po kliknutí a teprve potom ta služba uvidí tvou IP adresu. Když zpráva vypadá jako nabídka drog, zbraní nebo nahých fotek, prohlížeč tě před odesláním upozorní. Děje se to jen u tebe, nikam se to neposílá a nikdo se to nedozví.
