tfa.newCodesTitle=Your backup codes
tfa.newCodesText=Keep them safe (print them, take a photo or write them down). Each works once – for when you don't have your phone. You won't see them again.
tfa.regenerate=New backup codes
tfa.disable=Turn off
tfa.disableText=For new backup codes or to turn it off, enter a code from the app.
tfa.adminLocked=As an admin you must keep two-factor sign-in on; it can't be turned off.
