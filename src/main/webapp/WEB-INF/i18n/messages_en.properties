# --- GDPR, privacy, terms
privacy.heading=Privacy policy
terms.heading=Terms of use
terms.updated=Valid from 5 November 2026
terms.lead=A few simple rules so that skeli.cz can be a good place for everyone.
terms.s1.t=About the site
terms.s1.p=Skeli.cz is the official website of the rapper Skeli, run by Radek Dvořák. You can reach me at <a href="mailto:skelimc@seznam.cz">skelimc@seznam.cz</a>. You can browse the music, videos and lyrics without signing up. Some features, such as comments, voting, messages or karaoke, need an account.
terms.s2.t=Your account
terms.s2.p=Everyone may have only one account. Sign up with an e-mail address you have access to and don’t share your password with anyone. If you think someone has misused your account, change your password and write to me. If you are under 15, you need the consent of a parent or legal guardian to sign up. You can delete your account at any time in Settings. Only add tracks to My music that you made or have the rights to. I may hide a track that infringes other people’s rights. The rules of decent behaviour apply to private messages too. Serious or repeated breaches of the rules can get an account blocked or deleted.
terms.s3.t=Community rules
terms.s3.p=You may criticise the music and other people’s opinions, but personal attacks don’t belong here. In comments, messages, on your profile, profile photo, profile header and in My music, the following is forbidden:
terms.rule1=spam, unsolicited advertising and posting the same content again and again,
terms.rule2=insults, bullying and targeted harassment of others,
terms.rule3=hatred of people because of their origin, nationality, religion, gender, sexual orientation, health or similar,
terms.rule4=threats, calls for violence and glorifying it,
terms.rule5=publishing other people’s personal data without permission, such as an address, phone number or private photos,
terms.rule6=illegal content and links to fraudulent or harmful sites,
terms.rule7=pretending to be someone else, for example Skeli,
terms.rule8=offering or looking for drugs, weapons and other illegal goods,
terms.rule9=pornography and sexual content. Content showing the sexual abuse of children and other suspected serious crimes involving children are dealt with first. In cases set by law we inform the competent authorities; in other cases we may report the suspicion to them.
terms.s4.t=Reports and moderation
terms.s4.p=You can report a comment, profile or message that breaks the rules with the button next to it. The administrator reviews the report and, depending on the situation, keeps, edits or deletes the content. A track in My music can be hidden. For serious or repeated breaches, the administrator can block or delete the account. Illegal content and suspected danger to a child are handled first; when we inform the competent authorities is described in the last point of the Community rules above. The administrator doesn’t normally read private messages; the administration only shows a message that someone has reported. How messages are protected is described in the <a href="/privacy.jsp">Privacy policy</a>. For reports and for contact from authorities, use <a href="mailto:skelimc@seznam.cz">skelimc@seznam.cz</a> (Czech or English). If you disagree with a decision, write to the same address and ask for it to be reviewed again.
terms.s5.t=Your comments
terms.s5.p=What you write stays yours. By posting, you agree that the comment will be shown publicly on the website. You can edit or delete your own comment. If you delete your account, your comments stay, marked “Deleted account” and no longer linked to your profile. If you want them deleted as well, write to <a href="mailto:skelimc@seznam.cz">skelimc@seznam.cz</a>.
terms.s6.t=Site content
terms.s6.p=The music, lyrics, videos, photos and logo belong to Skeli, or to co-authors and other rights holders. Share links to the music as much as you like. Copying and further distributing whole lyrics, photos or recordings is only allowed with the rights holder’s permission, unless the law directly allows it.
terms.s7.t=Other companies' services
terms.s7.p=The website contains content and links from YouTube, Spotify, Apple Music, SoundCloud, Instagram and Facebook, and you can also sign in with Google. These services have their own terms and policies. How the website works with them is described in the <a href="/privacy.jsp">Privacy policy</a>.
terms.s8.t=No guarantee
terms.s8.p=I do my best to keep the website running well, but errors or outages can happen. Features may change, be added or disappear over time. This does not affect the rights the law gives you.
terms.s9.t=Changes to these terms
terms.s9.p=When the terms change, we publish the new version and the date it applies from. We announce important changes on the website.

