about.intro1=My name is Radek Dvořák, born in 1992. 🦖 I make music as <strong>Skeli</strong> and I've been into it since I was fifteen.
about.selftaught.text=I'm self-taught. I learned everything on my own, step by step – from writing lyrics, recording and working with sound to making music videos. I love experimenting, looking for my own sound and trying new things. I don't want to stick to one box. Every track has its own story and a reason why it was made.
about.web.text=I took the same path outside music too. <strong>I built Skeli.cz myself</strong>, because I wanted a space of my own where I can present my work the way I see it. From the first ideas to how the site actually runs, it's another part of my project that I'm building with my own hands.
about.squad.title=Skelo Squad 🖤
about.squad.p1=My dream is to build my own music label called <strong>Skelo Squad</strong>. A place where new projects can be born, artists can work together and create something bigger.
about.squad.p2=We're only at the beginning. I'm building it together with my girlfriend Andy, who helps me with social media, music videos and other things around my music.
about.squad.p3=I'm still learning, looking for new possibilities and moving forward. I don't want to stop at ideas. I want to turn them into reality, step by step.
about.outro=<strong>I'm Skeli. This is my music, my vision and a world I'm building my own way.</strong> 🤘
about.signature=Skelo Squad.
about.music.title=Music journey
about.music.text=From the first tracks to the current work. Find clips and playlists on the Music page.
about.collab.title=Collaboration
about.collab.text=If you enjoy my work, get in touch. I welcome rap features, beat production and visuals.
