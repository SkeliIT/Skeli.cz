privacy.updated=Valid from 5 November 2026
privacy.lead=Here you’ll find out which personal data skeli.cz processes, why, how long it keeps it and what rights you have.
privacy.s1.t=Who is responsible
privacy.s1.p=The controller of personal data is Radek Dvořák (Skeli). For privacy questions, write to me at <a href="mailto:skelimc@seznam.cz">skelimc@seznam.cz</a>. You can send requests for access to your data, its correction or deletion to the same address.
privacy.s2.t=What we process and why
privacy.s2.account=<b>Account:</b> username, e-mail, password (only as a bcrypt hash, we never know the password itself), registration date and e-mail confirmation. Used to run your account and the features for signed-in users, such as comments and voting (performance of a contract, i.e. the terms of use).
privacy.s2.profile=<b>Profile (optional):</b> display name, age, city, a few words about yourself, profile photo, profile header, website look and language. You fill in only what you want and can change or delete it at any time (consent). Only you see friend requests and the people you have blocked. Whether other signed-in users see your city, a few words about you, songs with a heart, friends, online status or recent activity is up to you in Settings → Privacy. If you add your own music, we store the title, year and links to the tracks; other signed-in users see them until you switch that off. If you make your profile visible to visitors who aren’t signed in, anyone with the link sees your name, photo, introduction and tracks. We don’t offer such a profile to search engines (we tell them not to index it), but we can’t guarantee the link won’t appear somewhere.
privacy.s2.comments=<b>Comments and votes:</b> the comment text, date and votes on songs and comments. Comments are public, including the author’s name. Only the administrator sees reports of comments.
privacy.s2.newsletter=<b>News by e-mail:</b> your e-mail and the dates of subscribing and confirming. The subscription starts only after you click the link in the confirmation e-mail, and every e-mail has a link to unsubscribe (consent).
privacy.s2.security=<b>Security:</b> we keep your IP address briefly in the server’s memory to protect against spam and password guessing; if no further attempt comes from it for about a day, it is forgotten. It also appears in the server’s technical logs. When you set a password, we check with the Have I Been Pwned service whether it has leaked from other websites: only the first 5 characters of its SHA-1 hash are sent, never the password or your data (legitimate interest – security).
privacy.s2.stats=<b>Counting visits (no cookies):</b> when a page is shown, the website calculates a daily fingerprint from your IP address and browser type (for signed-in users from the account number) using a random key of the day. The key is replaced with a new one every day at midnight, so fingerprints from different days can’t be linked to each other. During the day, while the key is still valid, a signed-in user’s fingerprint could be linked to their account, so we don’t consider it anonymous. Only the day and the fingerprint are stored; we don’t store the IP address or browser type. It is used only for numbers: how many people are on the website right now, how many came in a day and how many times a song’s lyrics were read. Fingerprints of closed days are deleted the next day; only the number of people per day remains (legitimate interest – an overview of visits).
privacy.s2.plays=<b>What gets played most (no cookies):</b> the same daily fingerprint is used to count how many times lyrics were opened, a video was started and someone entered the karaoke cinema. Each item counts for you at most once a day, even if you sign in during your visit. Fingerprints for individual songs and videos are deleted the next day; only the totals remain. Used for overviews in the administration (legitimate interest – an overview of what people enjoy).
privacy.s2.reports=<b>Reporting a problem to Kevin (optional):</b> the text you write and the address of the page you were on; for signed-in visitors also your account. We don't store your IP address. Only the administrator sees it and deletes the report once the problem is fixed (legitimate interest – fixing the site).
privacy.s2.help=<b>Filling in a missing part of a song's lyrics (optional):</b> the text you write; for signed-in visitors also your account. We don't store your IP address. Only the administrator sees it and deletes it once it's been used (legitimate interest – complete lyrics).
privacy.s2.marketing=<b>Where visitors come from (statistics):</b> at the start of a visit we count only the name of the site you came from (e.g. instagram.com – nothing more of the address), a campaign tag from the link (e.g. ?z=ig-bio), the kind of device (phone / tablet / computer), the site language and the hour. In the same way we only count clicks on links to Spotify, Apple Music, YouTube and social networks, and words searched for in Lyrics (deleted after 90 days). Only daily totals are stored – no cookies, no IP address, none of it can be linked to you (legitimate interest – knowing where fans come from and what interests them).
privacy.s2.trash=<b>Bin in the admin:</b> when the administrator deletes a comment (or a song or video together with the comments under it), a copy stays in the bin for 30 days so a mistake can be undone; then it is deleted for good. A comment you delete yourself is not kept (legitimate interest – protection against mistakes).
privacy.s2.social=<b>Friends and notifications:</b> friend requests, your list of friends and blocked people, and notifications in the bell (replies, hearts, requests, messages, CatSmash). A blocked person never finds out about it, and you get no notifications from them. Only the administrator sees reports of a profile or comment (who reported whom, the reason and the note).
privacy.s2.games=<b>CatSmash and badges:</b> results of matches against Kevin (time, score, difficulty), records, earned badges, the frame or mark you chose next to your name, and website badges (for comments, friends, karaoke and the like). Results appear in the record tables, which everyone can see. Others see your name and photo there only if you switch on “My name in the CatSmash tables” in Settings → Privacy. Otherwise you are an anonymous player there and your profile doesn’t show others your times or places in the tables.
privacy.s2.rewards=<b>Looks and rewards:</b> on which days you were signed in on the site (the date only, no time and nothing about what you did), which rewards you have unlocked and which looks you picked (profile look, karaoke font and style). The number of days is used only to unlock rewards. It is deleted together with your account and included in your data export.
privacy.s2.tfa=<b>Two-factor authentication (optional):</b> we store the key for the app on your phone encrypted and the backup codes only as hashes. They are used only for signing in.
privacy.s3.t=Cookies and browser storage
privacy.s3.session=<b>Necessary sign-in cookie</b> (JSESSIONID): signing in doesn't work without it. It lasts until you close the browser, 30 days with "Remember me on this device".
privacy.s3.known=<b>Known device</b> (skeliKnown): after a successful sign-in, your browser remembers your account number with a signature for a year. If a stranger tries to guess your password and signing in to your account is temporarily blocked because of it, you can still sign in from your own device. The cookie opens nothing by itself; the password is always needed (legitimate interest – security).
privacy.s3.storage=<b>Settings in your browser</b> (localStorage and sessionStorage): your choice in the cookie bar, light or dark mode, font and text size, karaoke, effects and sound settings, Kevin’s settings and the CatSmash game (local records and unlocked items). They stay in your browser and aren’t sent to the server by themselves. The exception is CatSmash match badges, which the game saves to your account.
privacy.s4.t=Content from other services
privacy.s4.p=YouTube videos and the Spotify player load only after your consent in the cookie bar or a click on "Load the player". Then YouTube (Google) or Spotify see your IP address and follow their own policies. Video thumbnails, fonts and icons come from our own server. Links to Instagram, Facebook, YouTube, Spotify and Apple Music lead to their sites.
privacy.s5.t=Who gets the data
privacy.s5.p=We never sell it. It is processed technically by the operator of the server and mail the site runs on (hosting in the Czech Republic); e-mails (account confirmation, password reset, news) go out through the mail server.
privacy.s6.t=How long
privacy.s6.p=Account and profile until the account is deleted. The newsletter until you unsubscribe. A password reset link is valid for 30 minutes, an e-mail confirmation for 48 hours. Messages, reports and statistics have their own periods described above. Database backups are used only to recover after a failure.
privacy.s6.more=Problem reports until they are sorted out. Your rating of the site until you delete your account.
privacy.s7.t=Deleting your account
privacy.s7.p=In Settings → Delete account. Your name, e-mail, password, Google sign-in, two-factor authentication, profile photo, profile header, profile, music, friends and blocked people, notifications, messages, game results and badges, website rating and newsletter subscription are deleted, and you are signed out on all devices. Comments stay marked “Deleted account” and votes stay counted, no longer linked to you. Reports you sent are deleted once the administrator has handled them. Reports about your account or your messages stay as evidence until they are handled and then for at most a year (legitimate interest – protecting other users). Want your comments deleted too? Write to <a href="mailto:skelimc@seznam.cz">skelimc@seznam.cz</a>.
privacy.s8.t=Your rights
privacy.s8.p=You have the right to access your data and have it corrected and, under the conditions set by law, also to erasure, restriction of processing and portability. You can object and withdraw your consent without affecting the processing before the withdrawal. You can download your data in Settings → Export data (JSON) and correct your profile directly in Settings. Send requests to <a href="mailto:skelimc@seznam.cz">skelimc@seznam.cz</a>. You can file a complaint with the Czech Office for Personal Data Protection (<a href="https://uoou.gov.cz" target="_blank" rel="noopener">uoou.gov.cz</a>).
privacy.s9.t=Age
privacy.s9.p=If you are under 15, you need the consent of a parent or legal guardian to sign up.
