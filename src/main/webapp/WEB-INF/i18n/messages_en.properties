tfa.title=Two-factor sign-in
tfa.lead=Besides your password, you also enter a code from an app on your phone when you sign in (Google Authenticator, Microsoft Authenticator, Aegis…). Someone who only knows your password can't get into your account.
tfa.off=Off for now.
tfa.start=Turn on
tfa.scan=Scan the QR code with the app on your phone (or type in the key), then enter the 6-digit code it shows you.
tfa.key=Key for typing in by hand:
