about.intro1=My name is Radek Dvořák, born in 1992. 🦖
about.intro2=I make music as Skeli and I've been into it since I was fifteen.
about.selftaught.text=I'm a Czech rapper/singer and above all self-taught. I never went to a music school and have no formal music education. I learned everything step by step on my own – from writing lyrics through recording to working with sound and making videos. And I keep learning, because I feel that in music you never get to the point where you know it all.
about.work.text=Outside music I originally worked as a plumber. I also tried a few factories, which pretty quickly taught me one important thing:
about.work.quote=Factory? Definitely not.
about.why.p1=For me music is mainly a way to capture the things you live through, think about, or just don't want to let slip through your head. Sometimes it's a story, sometimes a mood, sometimes an ordinary life situation and sometimes something that really makes me angry. So every track can come from a completely different place.
about.why.p2=I don't feel the need to stick to one topic or one style. I enjoy trying new things and moving forward – whether it's the writing itself, recording, sound, a music video or the whole way the music is presented.
about.squad.p1=A big part of my journey is also Skelo Squad.
about.squad.p2=Skelo Squad isn't just a name I put at the end of my posts. It's my dream to build my own music label one day, where other artists could release their music and we could create something bigger together.
about.squad.p3=For now Skelo Squad is a small team: me and my girlfriend, who I've been with for over ten years. She helps me with social media and music videos and is behind a lot of things you don't see at first glance.
about.squad.p4=So maybe we're not a big label yet.
about.squad.p5=But everyone starts somewhere.
about.squad.p6=And that's exactly why I want to keep building Skelo Squad step by step – as a place for my own work, for collaboration and one day maybe for other artists who want to be part of it.
about.outro=I'm Skeli. This is my music, my journey and the beginning of Skelo Squad. 🖤
about.signature=Skelo Squad.
about.music.title=Music journey
about.music.text=From the first tracks to the current work. Find clips and playlists on the Music page.
about.collab.title=Collaboration
about.collab.text=If you enjoy my work, get in touch. I welcome rap features, beat production and visuals.
