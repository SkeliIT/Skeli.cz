# --- GDPR, privacy, terms
privacy.heading=Privacy policy
terms.heading=Terms of use
terms.updated=Valid from 8 October 2026
terms.lead=A few clear rules so everyone feels good here – fans, critics and Skeli.
terms.s1.t=About the site
terms.s1.p=skeli.cz is Skeli's official website, run by Radek Dvořák (Skeli), contact <a href="mailto:skelimc@seznam.cz">skelimc@seznam.cz</a>. You can read the lyrics, listen and watch without an account; an account is only needed to comment and vote.
terms.s2.t=Your account
terms.s2.p=One person = one account. Use an e-mail you can access and never share your password – you are responsible for what is written from your account. If you are under 15, you need a parent's consent. You can delete your account any time in Settings.
terms.s3.t=Community rules
terms.s3.p=Criticising the music is fine, hating people is not. In the comments it is forbidden to post:
terms.rule1=spam, advertising or the same text again and again,
terms.rule2=insults, bullying and attacks on other people,
terms.rule3=hate because of origin, nationality, religion, gender, sexuality, health or similar,
terms.rule4=threats and calls for violence,
terms.rule5=other people's personal data (address, phone, photos…) – so-called doxxing,
terms.rule6=illegal content and links to fraudulent or harmful sites,
terms.rule7=pretending to be someone else (for example Skeli).
terms.s4.t=Reports and moderation
terms.s4.p=Report a comment that breaks the rules with the button next to it. Only the administrator sees reports and decides: the comment stays, is edited or is deleted. For serious or repeated violations the account can be deleted too. Disagree with a decision? Write to <a href="mailto:skelimc@seznam.cz">skelimc@seznam.cz</a> and we will look at it again.
terms.s5.t=Your comments
terms.s5.p=What you write stays yours. By posting you agree that the comment is shown publicly on the site. You can edit or delete your own comments. After your account is deleted, comments stay under "Deleted account"; if you want them deleted too, write to us.
terms.s6.t=Site content
terms.s6.p=The music, lyrics, videos, photos and logo belong to Skeli (or co-authors). Share links as you like; copying and spreading whole lyrics, photos or recordings is only allowed with his consent.
terms.s7.t=Other companies' services
terms.s7.p=Videos, music and links lead to YouTube, Spotify, Apple Music, Instagram and Facebook. They have their own terms and policies; how the site works with them is described in the <a href="/privacy.jsp">Privacy policy</a>.
terms.s8.t=No guarantee
terms.s8.p=We make the site with love, but without a guarantee that it will always run without errors. Features may change, appear or disappear.
terms.s9.t=Changes to these terms
terms.s9.p=When the rules change, we update the date at the top of this page. Bigger changes are announced on the site.

