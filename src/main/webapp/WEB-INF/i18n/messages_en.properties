privacy.s2.chat=<b>Messages (optional):</b> the text, time, who wrote to whom and whether a message has been read. We store them so you can read them. The text is encrypted in the database and cannot be read in the site’s admin area; the administrator sees only a message that someone reports. This is not device-to-device encryption: a server administrator who also has the key could technically reach them. Messages delete themselves after a year. You can delete your own message or a whole conversation at any time; a conversation disappears for you, and once the other person deletes it too, it is gone for good. Deleting your account removes all your conversations. A copy of a reported message stays until the administrator deals with it, and then for at most a year. A link from YouTube, Spotify, Apple Music or SoundCloud gets a card in the message. The player loads only after you click, and only then does that service see your IP address. If a message looks like an offer of drugs, weapons or nude photos, your browser warns you before sending. This happens only on your side, nothing is sent anywhere and nobody finds out.
