privacy.updated=Valid from 21 October 2026
privacy.lead=Plainly and truthfully: what data skeli.cz processes, why, for how long and what you can do about it.
privacy.s1.t=Who is responsible
privacy.s1.p=The data controller is Radek Dvořák (Skeli), e-mail <a href="mailto:skelimc@seznam.cz">skelimc@seznam.cz</a>. Send any request about your data to this address.
privacy.s2.t=What we process and why
privacy.s2.account=<b>Account:</b> username, e-mail, password (only as an encrypted bcrypt hash – we never know the password itself), date of sign-up and e-mail confirmation. Used to run the account, comments and voting (performance of a contract – the terms of use).
privacy.s2.profile=<b>Profile (optional):</b> display name, age, city, a few words about you, profile photo, theme and language. You fill in only what you want and can change or delete it any time (consent).
privacy.s2.comments=<b>Comments and votes:</b> the comment text, its date and votes on songs and comments. Comments are public. Only the administrator sees reports of comments.
privacy.s2.newsletter=<b>News by e-mail:</b> your e-mail and the dates of subscribing and confirming. The subscription starts only after you click the link in the confirmation e-mail, and every e-mail has a link to unsubscribe (consent).
privacy.s2.security=<b>Security:</b> your IP address is kept briefly in the server's memory to stop spam and password guessing and appears in the server's technical logs. When you set a password we check whether it has appeared in data breaches (Have I Been Pwned): only the first 5 characters of the password's hash leave the server, never the password or your details (legitimate interest – security).
privacy.s2.stats=<b>Visit counting (no cookies):</b> when a page is shown, the site turns your IP address and browser type (or your account number when signed in) into an anonymous fingerprint. Its key is thrown away every day at midnight and a new one is made, so the fingerprint can neither identify you nor link visits from different days. It is only used for numbers: how many people are on the site right now, how many came in a day and how often a song text was read (each text counts at most once a day for you). We do not store your IP address or browser (legitimate interest – knowing how the site is used).
privacy.s2.plays=<b>What gets played most (no cookies):</b> with the same daily fingerprint as for visits, the site counts how often a song's lyrics were opened, a clip was started and the karaoke cinema was entered – each thing counts for you at most once a day. If you sign in during a visit, you count only once that day. It only feeds the charts in the admin (legitimate interest – knowing what people enjoy).
privacy.s2.reports=<b>Reporting a problem to Kevin (optional):</b> the text you write and the address of the page you were on; for signed-in visitors also your account. We don't store your IP address. Only the administrator sees it and deletes the report once the problem is fixed (legitimate interest – fixing the site).
privacy.s3.t=Cookies and browser storage
privacy.s3.session=<b>Necessary sign-in cookie</b> (JSESSIONID): signing in doesn't work without it. It lasts until you close the browser, 30 days with "Remember me on this device".
privacy.s3.storage=<b>Settings in your browser</b> (localStorage): your choice in the cookie bar, light/dark theme, lyrics text size, the Spotify player's state and MC Kevin's settings. They stay in your browser and are never sent to the server.
privacy.s3.matomo=<b>Visitor statistics</b> with Matomo on the site operator's server (not Google) – it loads only after you allow it in the cookie bar ("Accept all" or "Settings" → Visitor statistics). Until then nothing is sent to the statistics server. You can change or withdraw your consent any time with "Cookie settings" in the footer.
privacy.s4.t=Content from other services
privacy.s4.p=YouTube videos and the Spotify player load only after your consent in the cookie bar or a click on "Load the player". Then YouTube (Google) or Spotify see your IP address and follow their own policies. Clip thumbnails, fonts and icons come from our own server. Links to Instagram, Facebook, YouTube, Spotify and Apple Music lead to their sites.
privacy.s5.t=Who gets the data
privacy.s5.p=We never sell it. It is processed technically by the operator of the server and mail the site runs on (hosting in the Czech Republic); e-mails (account confirmation, password reset, news) go out through the mail server.
privacy.s6.t=How long
privacy.s6.p=The account and profile until you delete the account. The news subscription until you unsubscribe. A password reset link is valid for 30 minutes, an e-mail confirmation for 48 hours. Database backups serve only to recover after a failure.
privacy.s6.more=Problem reports until they are sorted out. Your rating of the site until you delete your account.
privacy.s7.t=Deleting your account
privacy.s7.p=In Settings → Delete account. Your name, e-mail, password, profile photo, profile, reports and news subscription are deleted and you are signed out on every device. Comments stay as "Deleted account" and votes stay counted, no longer linked to you. Want the comments deleted too? Write to <a href="mailto:skelimc@seznam.cz">skelimc@seznam.cz</a>.
privacy.s8.t=Your rights
privacy.s8.p=You have the right to access your data (Settings → Export data (JSON)), to correct it (Settings), to erasure, restriction, portability (the download is JSON), to object and to withdraw consent. You can complain to the Czech Office for Personal Data Protection (<a href="https://uoou.gov.cz" target="_blank" rel="noopener">uoou.gov.cz</a>).
privacy.s9.t=Age
privacy.s9.p=If you are under 15, ask your parents to agree to your sign-up.
