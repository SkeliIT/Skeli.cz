name: Deploy Skeli.cz

# main       -> https://test.skeli.cz  (service skeli-test)
# production -> https://www.skeli.cz   (service skeli-production)
#
# The server runs the app from a git checkout (systemd service running `mvn jetty:run`),
# so a deploy fast-forwards that checkout over SSH; the steps are in deploy/remote-deploy.sh.
# Secrets: DEPLOY_KEY (private key, restricted in authorized_keys), DEPLOY_HOST, DEPLOY_USER.

on:
  push:
    branches:
      - main
      - production
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: maven

      # nothing reaches the server unless it builds and the unit tests pass
      - name: Build and unit tests
        run: mvn -B verify

      - name: Pick environment
        id: env
        run: |
          case "$GITHUB_REF_NAME" in
            main)
              { echo "dir=/home/skeli/WWW/skeli.cz/web"; echo "service=skeli-test"; echo "port=8082"
                echo "backup=no"; echo "url=https://test.skeli.cz"; } >> "$GITHUB_OUTPUT" ;;
            production)
              { echo "dir=/home/skeli/WWW/production.skeli.cz/web"; echo "service=skeli-production"; echo "port=8083"
                echo "backup=yes"; echo "url=https://www.skeli.cz"; } >> "$GITHUB_OUTPUT" ;;
            *)
              echo "::error::No environment for branch $GITHUB_REF_NAME"; exit 1 ;;
          esac

      - name: Setup SSH
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          if [ -z "$DEPLOY_KEY" ] || [ -z "$DEPLOY_HOST" ]; then
            echo "::error::DEPLOY_KEY / DEPLOY_HOST secrets are empty"; exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pinned server host key (it is public). If the server ever presents another key,
          # the deploy stops instead of trusting it. Fingerprint SHA256:n2oHXaDpxxQnGE8T4b+atsocJx0edeSYntftPm8qwAU
          echo "$DEPLOY_HOST ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGgePBd4PA2O/Q8iigfbuyH3oJAO0WZ5gF7XHTLzDJ9k" > ~/.ssh/known_hosts

      - name: Deploy to ${{ steps.env.outputs.url }}
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" bash -s -- \
            "${{ steps.env.outputs.dir }}" "${{ steps.env.outputs.service }}" "${{ steps.env.outputs.port }}" \
            "$GITHUB_REF_NAME" "$GITHUB_SHA" "${{ steps.env.outputs.backup }}" \
            < deploy/remote-deploy.sh

      # the same pages once more from the outside, through Apache and HTTPS
      - name: Check the public site
        run: |
          url="${{ steps.env.outputs.url }}"
          ok=1
          for check in "/ 200" "/texty.jsp 200" "/login.jsp 200" "/css/base.css 200" "/admin.jsp 403"; do
            set -- $check
            got=$(curl -s -o /dev/null -m 20 -w '%{http_code}' "$url$1" || true)
            echo "$url$1 -> $got (expected $2)"
            [ "$got" = "$2" ] || ok=0
          done
          [ "$ok" = 1 ] || { echo "::error::The public site does not answer as expected"; exit 1; }

      - name: Remove the key
        if: always()
        run: rm -f ~/.ssh/deploy_key
